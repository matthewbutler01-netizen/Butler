name: BF-657 Apply

on:
  push:
    branches:
      - bf-657-dashboard-next-decision-plan
    paths:
      - .github/workflows/bf657-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-657-dashboard-next-decision-plan
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply BF-657 patch
        run: python .github/bf657_patch.py
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile dashboard regression tests
        run: ./gradlew :bet:bet-cli:testClasses --no-daemon
      - name: Run BF-657 and preserved dashboard contracts
        run: ./gradlew :bet:bet-cli:test --tests io.butler.bet.cli.ButlerDashboardBf657ScriptTest --tests io.butler.bet.cli.ButlerDashboardBf656ScriptTest --tests io.butler.bet.cli.ButlerDashboardBf655ScriptTest --tests io.butler.bet.cli.ButlerDashboardScriptTest --no-daemon
      - name: Commit BF-657 dashboard wiring
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1
          git diff --cached --quiet && exit 0
          git commit -m "BF-657: surface governed next-decision plan"
          git push origin HEAD:bf-657-dashboard-next-decision-plan
