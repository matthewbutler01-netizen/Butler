name: BF-538 patch

on:
  push:
    branches:
      - bf-538-improve-roster-strength-terminal-readability
    paths:
      - .github/workflows/bf538-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: bf-538-improve-roster-strength-terminal-readability
      - name: Apply BF-538 terminal readability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cli = Path('bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerLeagueRosterStrengthCli.java')
          text = cli.read_text(encoding='utf-8')
          old = '        for (var team : report.teams()) {\n            System.out.printf("%s [%s]: tier=%s starter-value=%.2f total-player-value=%.2f coverage=%d/%d (%.1f%%) stale=%d missing=%d%n",\n                team.teamName(), team.teamId(), team.tier(), team.starterValue(), team.totalPlayerValue(),\n                team.valuedPlayers(), team.totalPlayers(), team.coveragePercent(), team.stalePlayers(), team.missingPlayers());\n        }\n    }\n'
          new = '        for (var team : report.teams()) {\n            printTeam(team);\n        }\n    }\n\n    static void printTeam(LeagueRosterStrengthTierAnalyzer.TeamRosterStrength team) {\n        if (team == null) throw new IllegalArgumentException("team must not be null");\n        System.out.printf("%s  tier=%s  starter-value=%.2f  total-player-value=%.2f%n",\n            team.teamName(), team.tier(), team.starterValue(), team.totalPlayerValue());\n        System.out.printf("  coverage=%d/%d (%.1f%%)  stale=%d  missing=%d  team-id=%s%n",\n            team.valuedPlayers(), team.totalPlayers(), team.coveragePercent(),\n            team.stalePlayers(), team.missingPlayers(), team.teamId());\n    }\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected roster-strength output block once, found {text.count(old)}')
          cli.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerLeagueRosterStrengthCliTest.java')
          text = test.read_text(encoding='utf-8')
          import_anchor = 'package io.butler.bet.cli;\n\nimport org.junit.jupiter.api.Test;\n\nimport java.time.LocalDate;\n'
          import_replacement = 'package io.butler.bet.cli;\n\nimport io.butler.bet.intelligence.LeagueRosterStrengthTierAnalyzer;\nimport io.butler.bet.intelligence.LeagueRosterStrengthTierPolicy;\nimport org.junit.jupiter.api.Test;\n\nimport java.io.ByteArrayOutputStream;\nimport java.io.PrintStream;\nimport java.nio.charset.StandardCharsets;\nimport java.time.LocalDate;\n'
          if text.count(import_anchor) != 1:
              raise SystemExit(f'expected roster-strength test import anchor once, found {text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)
          assert_anchor = 'import static org.junit.jupiter.api.Assertions.assertThrows;\n'
          assert_replacement = 'import static org.junit.jupiter.api.Assertions.assertThrows;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n'
          if text.count(assert_anchor) != 1:
              raise SystemExit(f'expected assertion import anchor once, found {text.count(assert_anchor)}')
          text = text.replace(assert_anchor, assert_replacement, 1)
          marker = '    @Test\n    void parsesDefaultSourceExplicitSourceAndMinimumAsOf() {'
          addition = (
              '    @Test\n'
              '    void rendersRosterStrengthAsCompactPrimaryAndDetailRows() {\n'
              '        var team = new LeagueRosterStrengthTierAnalyzer.TeamRosterStrength(\n'
              '            "team-123", "Love: JT, Jeanty &Javonte", 850.25, 1425.50,\n'
              '            25, 24, 1, 0, LeagueRosterStrengthTierPolicy.Tier.FRONT_ROSTER_TIER);\n'
              '\n'
              '        PrintStream original = System.out;\n'
              '        ByteArrayOutputStream buffer = new ByteArrayOutputStream();\n'
              '        try {\n'
              '            System.setOut(new PrintStream(buffer, true, StandardCharsets.UTF_8));\n'
              '            ButlerLeagueRosterStrengthCli.printTeam(team);\n'
              '        } finally {\n'
              '            System.setOut(original);\n'
              '        }\n'
              '        String output = buffer.toString(StandardCharsets.UTF_8);\n'
              '        String[] lines = output.strip().split("\\\\R");\n'
              '\n'
              '        assertEquals(2, lines.length);\n'
              '        assertEquals(\n'
              '            "Love: JT, Jeanty &Javonte  tier=FRONT_ROSTER_TIER  starter-value=850.25  total-player-value=1425.50",\n'
              '            lines[0]);\n'
              '        assertEquals("  coverage=24/25 (96.0%)  stale=1  missing=0  team-id=team-123", lines[1]);\n'
              '        assertTrue(lines[0].length() <= 120);\n'
              '    }\n'
              '\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f'expected roster-strength test insertion point once, found {text.count(marker)}')
          test.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/bf538-patch.yml
      - name: Commit BF-538 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerLeagueRosterStrengthCli.java bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerLeagueRosterStrengthCliTest.java .github/workflows/bf538-patch.yml
          git commit -m "BF-538: improve roster-strength terminal readability"
          git push origin HEAD:bf-538-improve-roster-strength-terminal-readability
