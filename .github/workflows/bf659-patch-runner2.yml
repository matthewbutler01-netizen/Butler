name: BF-659 Temporary Patch Runner 2

on:
  push:
    branches:
      - bf-659-post-transaction-explanation-capture

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf-659-post-transaction-explanation-capture
      - name: Execute BF-659 patch with robust multiline matchers
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/bf659-patch.yml').read_text()
          start = workflow.index('          from pathlib import Path\n')
          end = workflow.index('      - name: Commit BF-659 wiring\n', start)
          embedded = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines()) + '\n'

          p0 = script.index("production_old = '''")
          p1 = script.index("ctor_old = '''", p0)
          production = '''import re
          production_new = """        this.evidenceSource = recommendation ->
              new SleeperLiveWaiverCrossPositionTransactionEvidence(database).explain(recommendation);
          this.postTransactionReplaySource = (target, audit) -> {
              var replay = new SleeperLiveWaiverPostTransactionRecommendationReplay(database).replay(target, audit);
              return new PostTransactionReplay(replay.recommendation(), replay.evidence());
          };
          this.clock = Clock.systemUTC();"""
          production_pattern = re.compile(
              r'        this\\.evidenceSource = recommendation ->\\n\\s+new SleeperLiveWaiverCrossPositionTransactionEvidence\\(database\\)\\.explain\\(recommendation\\);\\n        this\\.clock = Clock\\.systemUTC\\(\\);')
          capture, production_count = production_pattern.subn(production_new, capture, count=1)
          if production_count != 1:
              raise SystemExit('capture production constructor regex marker missing')
          '''
          script = script[:p0] + production + script[p1:]

          s0 = script.index("source_old = '''")
          s1 = script.index("helper_marker =", s0)
          source = '''source_new = """        SleeperLiveWaiverFinalRecommendationBundle.RecommendationReport recommendation;
          EvidenceSource payloadEvidenceSource = evidenceSource;
          try {
              recommendation = recommendationSource.run(target.butlerLeagueId(), target.sleeperUserId());
          } catch (IllegalStateException liveFailure) {
              if (!isPostTransactionRosterDrift(liveFailure) || postTransactionReplaySource == null) {
                  throw liveFailure;
              }
              PostTransactionReplay replay = postTransactionReplaySource.replay(target, audit);
              recommendation = Objects.requireNonNull(replay.recommendation(), "BF-659 replay recommendation must not be null");
              payloadEvidenceSource = ignored -> {
                  if (replay.evidence() == null) {
                      throw new IllegalStateException("BF-659 BLOCKED: cross-position replay evidence is missing");
                  }
                  return replay.evidence();
              };
          }
          reconcileAudit(audit, recommendation);
          ExplanationPayload payload = explanationPayload(recommendation, payloadEvidenceSource);"""
          source_pattern = re.compile(
              r'        SleeperLiveWaiverFinalRecommendationBundle\\.RecommendationReport recommendation =\\n\\s+recommendationSource\\.run\\(target\\.butlerLeagueId\\(\\), target\\.sleeperUserId\\(\\)\\);\\n        reconcileAudit\\(audit, recommendation\\);\\n        ExplanationPayload payload = explanationPayload\\(recommendation, evidenceSource\\);')
          capture, source_count = source_pattern.subn(source_new, capture, count=1)
          if source_count != 1:
              raise SystemExit('capture source regex marker missing')
          '''
          script = script[:s0] + source + script[s1:]

          r0 = script.index("call_old = '''")
          r1 = script.index("pair_marker =", r0)
          replay_insert = '''call_new = """        FrozenSnapshotFrame frozen = frozenSnapshotFrame(snapshotEntries, headers);
          validateFrozenPair(frozen, audit);
          ImportedFrame imported = importedFrame(target, frozen.rosteredIds());"""
          call_pattern = re.compile(
              r'        FrozenSnapshotFrame frozen = frozenSnapshotFrame\\(snapshotEntries, headers\\);\\n        ImportedFrame imported = importedFrame\\(target, frozen\\.rosteredIds\\(\\)\\);')
          replay, call_count = call_pattern.subn(call_new, replay, count=1)
          if call_count != 1:
              raise SystemExit('replay frozen regex marker missing')
          '''
          script = script[:r0] + replay_insert + script[r1:]

          exec(compile(script, 'bf659-embedded-patch.py', 'exec'))
      - name: Commit BF-659 wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverFinalRecommendationBundle.java \
                  bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCapture.java \
                  bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverPostTransactionRecommendationReplay.java \
                  bet/bet-cli/src/test/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCaptureTest.java
          git commit -m "BF-659 wire guarded post-transaction explanation replay"
          git push origin HEAD:bf-659-post-transaction-explanation-capture
