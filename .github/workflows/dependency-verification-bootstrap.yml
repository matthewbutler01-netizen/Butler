name: Dependency Verification Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/dependency-verification-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'bf-342-add-gradle-dependency-verification'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate SHA-256 dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 help

      - name: Print generated verification metadata
        run: cat gradle/verification-metadata.xml
