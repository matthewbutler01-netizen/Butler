name: BF-544 patch

on:
  push:
    branches:
      - bf-544-clarify-production-row-count-labels
    paths:
      - .github/workflows/bf544-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: bf-544-clarify-production-row-count-labels
      - name: Apply BF-544 label clarification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher = Path('bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerLauncher.java')
          text = launcher.read_text(encoding='utf-8')
          old = '        System.out.printf("Provider rows: %d  requested-season=%d  crosswalk=%d  mapped=%d%n",\n            result.providerRows(), result.providerRowsForSeason(), result.crosswalkEntries(), result.providerRowsMapped());'
          new = '        System.out.printf("provider-rows=%d  requested-season-rows=%d  crosswalk-entries=%d  mapped-provider-rows=%d%n",\n            result.providerRows(), result.providerRowsForSeason(), result.crosswalkEntries(), result.providerRowsMapped());'
          if text.count(old) != 1:
              raise SystemExit(f'expected production diagnostics once, found {text.count(old)}')
          launcher.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerLauncherNflverseProductionTest.java')
          text = test.read_text(encoding='utf-8')
          anchor = '        assertTrue(output.contains("nflverse production preview"));\n        assertTrue(output.contains("eligible=300  matched=280  unmatched=20"));'
          replacement = '        assertTrue(output.contains("nflverse production preview"));\n        assertTrue(output.contains("provider-rows=500  requested-season-rows=500  crosswalk-entries=12000  mapped-provider-rows=450"));\n        assertFalse(output.contains("requested-season=500"));\n        assertTrue(output.contains("eligible=300  matched=280  unmatched=20"));'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected CLI test insertion point once, found {text.count(anchor)}')
          test.write_text(text.replace(anchor, replacement, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/bf544-patch.yml
      - name: Commit BF-544 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerLauncher.java bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerLauncherNflverseProductionTest.java .github/workflows/bf544-patch.yml
          git commit -m "BF-544: clarify nflverse production row-count labels"
          git push origin HEAD:bf-544-clarify-production-row-count-labels
