name: BF-649 Hotfix Apply

on:
  push:
    branches:
      - bf-649-hotfix-powershell51-parser

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-649-hotfix-powershell51-parser
          persist-credentials: true

      - name: Apply exact PowerShell 5.1-safe reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('scripts/butler-dashboard.ps1')
          text = dashboard.read_text(encoding='utf-8')
          old = '''    if ($bundleTarget.SleeperLeagueId -cne $summaryTarget.SleeperLeagueId
              -or $bundleTarget.RosterId -cne $summaryTarget.RosterId
              -or $bundleTarget.LeagueName -cne $summaryTarget.LeagueName
              -or $bundleTarget.DisplayName -cne $summaryTarget.DisplayName
              -or $bundleTarget.TeamName -cne $summaryTarget.TeamName
              -or $bundleTarget.Role -cne $summaryTarget.Role) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          '''
          new = '''    if ($bundleTarget.SleeperLeagueId -cne $summaryTarget.SleeperLeagueId) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          if ($bundleTarget.RosterId -cne $summaryTarget.RosterId) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          if ($bundleTarget.LeagueName -cne $summaryTarget.LeagueName) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          if ($bundleTarget.DisplayName -cne $summaryTarget.DisplayName) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          if ($bundleTarget.TeamName -cne $summaryTarget.TeamName) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          if ($bundleTarget.Role -cne $summaryTarget.Role) {
              throw "BF-649 BLOCKED: summary BF-623 target identity disagrees with waiver BF-623 target identity"
          }
          '''
          if old not in text:
              raise SystemExit('BF-649 hotfix BLOCKED: expected parser-incompatible reconciliation block not found')
          dashboard.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf649ScriptTest.java')
          test_text = test.read_text(encoding='utf-8')
          anchor = '''        assertTrue(script.contains("summary BF-623 target identity disagrees with waiver BF-623 target identity"));
'''
          addition = '''        assertTrue(script.contains("summary BF-623 target identity disagrees with waiver BF-623 target identity"));
        assertFalse(script.contains("\\n        -or $bundleTarget."));
        assertTrue(script.contains("if ($bundleTarget.SleeperLeagueId -cne $summaryTarget.SleeperLeagueId)"));
        assertTrue(script.contains("if ($bundleTarget.Role -cne $summaryTarget.Role)"));
'''
          if anchor not in test_text:
              raise SystemExit('BF-649 hotfix BLOCKED: expected BF-649 regression anchor not found')
          test.write_text(test_text.replace(anchor, addition, 1), encoding='utf-8')

          Path('.github/workflows/bf649-hotfix-apply.yml').unlink()
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1 bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf649ScriptTest.java .github/workflows/bf649-hotfix-apply.yml
          git commit -m "BF-649 hotfix: PowerShell 5.1-safe target reconciliation"
          git push origin HEAD:bf-649-hotfix-powershell51-parser
