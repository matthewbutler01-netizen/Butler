name: BF-650 Apply
on:
  push:
    branches: [bf-650-powershell51-ascii-dashboard]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-650-powershell51-ascii-dashboard
          persist-credentials: true
      - name: Patch dashboard
        run: python -c "from pathlib import Path; p=Path('scripts/butler-dashboard.ps1'); s=p.read_text(encoding='utf-8').replace('Starter · $($Player.LineupSlot)','Starter - $($Player.LineupSlot)').replace(' · ',' &middot; '); assert all(ord(c) < 128 for c in s); p.write_text(s,encoding='ascii')"
      - name: Commit dashboard patch
        run: |
          if git diff --quiet -- scripts/butler-dashboard.ps1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1
          git commit -m "BF-650: make dashboard source ASCII-only"
          git push origin HEAD:bf-650-powershell51-ascii-dashboard
