name: Aging Model Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'bf-173-capture-aging-model-evidence' || github.head_ref == 'bf-180-capture-aging-model-validation' || github.head_ref == 'bf-181-fix-temporal-holdout-unit-mixing' || github.head_ref == 'bf-184-capture-aging-model-smoothing-sensitivity' || github.head_ref == 'bf-187-capture-aging-model-transition-stability' || github.head_ref == 'bf-190-capture-aging-model-normalized-stability' || github.head_ref == 'bf-193-capture-aging-model-support-thresholds' || github.head_ref == 'bf-195-capture-threshold-worst-cell-evidence' || github.head_ref == 'bf-198-capture-aging-model-age-band-stability' || github.head_ref == 'bf-200-capture-age-band-retention-coverage' || github.head_ref == 'bf-203-capture-age-band-threshold-frontier-evidence' || github.head_ref == 'bf-205-capture-canonical-threshold-frontier-evidence' || github.head_ref == 'bf-209-capture-published-aging-model-evidence' || github.head_ref == 'bf-212-capture-published-cell-lookup-evidence' || github.head_ref == 'bf-215-capture-position-age-evidence' || github.head_ref == 'bf-218-capture-position-age-publication-coverage' || github.head_ref == 'bf-223-capture-publication-validation-evidence' || github.head_ref == 'bf-228-capture-age-outlook-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Butler
        run: ./gradlew :bet:bet-cli:classes

      - name: Capture empirical aging-model evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f butler.db aging-model-evidence.txt
          run_butler() {
            ./gradlew --quiet :bet:bet-cli:run --args="$*"
          }
          {
            echo "# Aging model empirical evidence"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Player universe refresh"
            run_butler nflverse aging-model-players-refresh
            echo
            echo "## Production universe refresh"
            run_butler nflverse aging-model-production-refresh 1999 2025
            echo
            echo "## Sample audit"
            run_butler aging-model sample-audit
            echo
            echo "## Sample breadth"
            run_butler aging-model sample-breadth
            echo
            echo "## Local smoother"
            run_butler aging-model local-smoother
            echo
            echo "## Published local smoother"
            run_butler aging-model published-smoother
            echo
            echo "## Publication validation"
            run_butler aging-model publication-validation
            echo
            echo "## Validated per-metric age outlook"
            run_butler aging-model age-outlook
            echo
            echo "## Published-cell lookup: published"
            run_butler aging-model published-cell QB PASSING_YARDS_PER_GAME 25
            echo
            echo "## Published-cell lookup: below support"
            run_butler aging-model published-cell QB PASSING_YARDS_PER_GAME 44
            echo
            echo "## Published-cell lookup: not observed"
            run_butler aging-model published-cell QB PASSING_YARDS_PER_GAME 99
            echo
            echo "## Position-age evidence: normal support"
            run_butler aging-model position-age-evidence QB 25
            echo
            echo "## Position-age evidence: sparse tail"
            run_butler aging-model position-age-evidence WR 39
            echo
            echo "## Position-age evidence: not observed"
            run_butler aging-model position-age-evidence QB 99
            echo
            echo "## Position-age publication coverage"
            run_butler aging-model position-age-coverage
            echo
            echo "## Temporal holdout"
            run_butler aging-model temporal-holdout
            echo
            echo "## Smoothing sensitivity"
            run_butler aging-model smoothing-sensitivity
            echo
            echo "## Transition stability"
            run_butler aging-model transition-stability
            echo
            echo "## Normalized stability"
            run_butler aging-model normalized-stability
            echo
            echo "## Support threshold tradeoffs"
            run_butler aging-model support-thresholds
            echo
            echo "## Age-band stability"
            run_butler aging-model age-band-stability
            echo
            echo "## Age-band threshold frontier"
            run_butler aging-model age-band-threshold-frontier
          } | tee aging-model-evidence.txt

      - name: Upload empirical evidence
        uses: actions/upload-artifact@v4
        with:
          name: aging-model-evidence
          path: aging-model-evidence.txt
          if-no-files-found: error
