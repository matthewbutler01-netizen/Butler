name: BF-651 Run

on:
  push:
    branches:
      - bf-651-current-governed-drop-my-team
    paths:
      - .github/workflows/bf651-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-651-current-governed-drop-my-team
      - name: Apply BF-651 dashboard patch
        run: python .github/bf651_patch.py
      - name: Commit dashboard patch
        shell: bash
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1
          git commit -m "BF-651: mark current governed DROP on My Team"
          git push origin HEAD:bf-651-current-governed-drop-my-team
