name: BF-651 Bootstrap

on:
  push:
    branches:
      - bf-651-current-governed-drop-my-team
    paths:
      - .github/workflows/bf651-bootstrap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-651-current-governed-drop-my-team
      - name: Repair apply workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/bf651-apply.yml')
          text = path.read_text(encoding='utf-8')
          old = "    if: github.event.head_commit.message == 'BF-651: stage dashboard patch helper'"
          new = "    if: \"${{ github.event.head_commit.message == 'BF-651: stage dashboard patch helper' }}\""
          if old not in text:
              raise SystemExit('BF-651 invalid if marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit workflow repair
        shell: bash
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add .github/workflows/bf651-apply.yml
          git commit -m "BF-651: stage dashboard patch helper"
          git push origin HEAD:bf-651-current-governed-drop-my-team
