name: BF-652 Apply

on:
  push:
    branches:
      - bf-652-pair-current-add-drop
    paths:
      - .github/workflows/bf652-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-652-pair-current-add-drop
      - name: Apply BF-652 dashboard patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/butler-dashboard.ps1')
          text = path.read_text(encoding='ascii')

          helper = r'''
function Get-CurrentGovernedTransactionPairView {
    param(
        [Parameter(Mandatory = $true)][string]$Bundle,
        [Parameter(Mandatory = $true)][string]$RosterContext,
        [Parameter(Mandatory = $true)][string]$Summary
    )

    $addCurrent = Get-CurrentGovernedAddView -Bundle $Bundle -Summary $Summary
    $dropCurrent = Get-CurrentGovernedDropView -RosterContext $RosterContext -Summary $Summary
    if ($addCurrent.Active -ne $dropCurrent.Active) {
        throw "BF-652 BLOCKED: current ADD/DROP lifecycle disagreement"
    }

    if (-not $addCurrent.Active) {
        return [pscustomobject]@{
            Active = $false
            Add = $null
            Drop = $null
            AddSleeperId = "none"
            DropSleeperId = "none"
            AddCurrent = $addCurrent
            DropCurrent = $dropCurrent
            Target = $addCurrent.Target
        }
    }

    foreach ($field in @("SleeperLeagueId", "RosterId", "LeagueName", "DisplayName", "TeamName", "Role")) {
        if ([string]$addCurrent.Target.$field -cne [string]$dropCurrent.Target.$field) {
            throw "BF-652 BLOCKED: BF-616 and BF-610 BF-623 target identity disagreement"
        }
    }
    if ($addCurrent.AuditId -cne $dropCurrent.AuditId -or $addCurrent.Bf629 -cne $dropCurrent.Bf629 -or $addCurrent.Bf631 -cne $dropCurrent.Bf631) {
        throw "BF-652 BLOCKED: current ADD/DROP audit or safety-gate disagreement"
    }

    $add = ConvertTo-PlayerView (Get-LineValue -Text $Summary -Label "ADD:")
    $drop = ConvertTo-PlayerView (Get-LineValue -Text $Summary -Label "DROP:")
    if ($add.SleeperId -cne $addCurrent.SleeperId) {
        throw "BF-652 BLOCKED: paired ADD does not match BF-649 current audited ADD identity"
    }
    if ($drop.SleeperId -cne $dropCurrent.SleeperId) {
        throw "BF-652 BLOCKED: paired DROP does not match BF-651 current audited DROP identity"
    }

    $candidates = @(Get-WaiverCandidates -Bundle $Bundle)
    $counts = Get-WaiverAuthorizedCounts -Bundle $Bundle
    if ($candidates.Count -ne $counts.Total) {
        throw "BF-652 BLOCKED: BF-616 parsed shortlist does not reconcile to BF-617 authorized total"
    }
    $addMatches = @($candidates | Where-Object { $_.SleeperId -ceq $add.SleeperId })
    if ($addMatches.Count -ne 1) {
        throw "BF-652 BLOCKED: paired ADD must resolve exactly once in BF-616 shortlist; found $($addMatches.Count)"
    }

    $players = @(Get-RosterPlayers -RosterContext $RosterContext)
    $dropMatches = @($players | Where-Object { $_.SleeperId -ceq $drop.SleeperId })
    if ($dropMatches.Count -ne 1) {
        throw "BF-652 BLOCKED: paired DROP must resolve exactly once in BF-610 target roster; found $($dropMatches.Count)"
    }

    return [pscustomobject]@{
        Active = $true
        Add = $addMatches[0]
        Drop = $dropMatches[0]
        AddSleeperId = $add.SleeperId
        DropSleeperId = $drop.SleeperId
        AddCurrent = $addCurrent
        DropCurrent = $dropCurrent
        Target = $addCurrent.Target
    }
}

'''
          marker = 'function Resolve-WaiverCandidateById {'
          if marker not in text:
              raise SystemExit('BF-652 helper insertion marker missing')
          text = text.replace(marker, helper + marker, 1)

          css_old = '.current-context{margin-top:16px;padding:14px 16px;border:1px solid #416fda;border-radius:14px;background:#0d1b3a;color:#c7d9ff}.lane{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}'
          css_new = '.current-context{margin-top:16px;padding:14px 16px;border:1px solid #416fda;border-radius:14px;background:#0d1b3a;color:#c7d9ff}.pair-context{margin-top:12px;padding:12px;border:1px solid #334a82;border-radius:12px;background:#101e3d;color:#c7d9ff;font-size:12px}.pair-context strong{display:block;color:#fff;margin-bottom:4px}.pair-context .pair-meta{color:#aebada;margin-top:3px}.pair-context .actions{margin-top:10px}.pair-context .button{padding:8px 11px;font-size:12px}.lane{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}'
          if css_old not in text:
              raise SystemExit('BF-652 CSS marker missing')
          text = text.replace(css_old, css_new, 1)

          team_head_old = '''function ConvertTo-TeamHtml {
    param(
        [Parameter(Mandatory = $true)][string]$RosterContext,
        [Parameter(Mandatory = $true)][string]$Summary
    )
    $players = @(Get-RosterPlayers -RosterContext $RosterContext)
    $current = Get-CurrentGovernedDropView -RosterContext $RosterContext -Summary $Summary'''
          team_head_new = '''function ConvertTo-TeamHtml {
    param(
        [Parameter(Mandatory = $true)][string]$RosterContext,
        [Parameter(Mandatory = $true)][string]$Summary,
        [Parameter(Mandatory = $true)][string]$Bundle
    )
    $players = @(Get-RosterPlayers -RosterContext $RosterContext)
    $pair = Get-CurrentGovernedTransactionPairView -Bundle $Bundle -RosterContext $RosterContext -Summary $Summary
    $current = $pair.DropCurrent'''
          if team_head_old not in text:
              raise SystemExit('BF-652 team signature marker missing')
          text = text.replace(team_head_old, team_head_new, 1)

          team_copy_old = '''            $currentCopy = if ($isCurrent) { '<div class="current-copy">Already-audited current DROP &middot; this marker is not a roster rank or lineup recommendation.</div>' } else { "" }'''
          team_copy_new = '''            $currentCopy = if ($isCurrent) { "<div class=`"current-copy`">Already-audited current DROP &middot; this marker is not a roster rank or lineup recommendation.</div><div class=`"pair-context`"><strong>Paired audited ADD</strong><div>$(ConvertTo-HtmlText $pair.Add.Name)</div><div class=`"pair-meta`">$(ConvertTo-HtmlText $pair.Add.Position) &middot; NFL $(ConvertTo-HtmlText $pair.Add.Team) &middot; Sleeper $(ConvertTo-HtmlText $pair.Add.SleeperId)</div><div class=`"current-copy`">Butler's already-audited current transaction &middot; not a roster rank or lineup recommendation.</div><div class=`"actions`"><a class=`"button`" href=`"/waivers/candidate/$(ConvertTo-HtmlText $pair.Add.SleeperId)`">View paired ADD</a></div></div>" } else { "" }'''
          if text.count(team_copy_old) != 2:
              raise SystemExit(f'BF-652 expected 2 team current-copy markers, found {text.count(team_copy_old)}')
          text = text.replace(team_copy_old, team_copy_new)

          team_tech_old = '<div>Current DROP Sleeper ID: $(ConvertTo-HtmlText $current.SleeperId)</div><div>BF-629 current gate:'
          team_tech_new = '<div>Current DROP Sleeper ID: $(ConvertTo-HtmlText $current.SleeperId)</div><div>Paired ADD Sleeper ID: $(ConvertTo-HtmlText $pair.AddSleeperId)</div><div>Paired DROP Sleeper ID: $(ConvertTo-HtmlText $pair.DropSleeperId)</div><div>BF-629 current gate:'
          if team_tech_old not in text:
              raise SystemExit('BF-652 team technical marker missing')
          text = text.replace(team_tech_old, team_tech_new, 1)

          team_boundary_old = 'If shown, <strong>Current governed DROP</strong> identifies the already-audited current drop only; it is not a roster rank or lineup recommendation. This page does not score roster needs, optimize a lineup, rank your players, select a new drop, set FAAB, run BF-641, refresh evidence, or submit a Sleeper transaction.'
          team_boundary_new = 'If shown, <strong>Current governed DROP</strong> identifies the already-audited current drop only, and <strong>Paired audited ADD</strong> identifies only its exact audited counterpart. Neither is a roster rank or lineup recommendation. This page does not score roster needs, optimize a lineup, rank your players, select a new add/drop, set FAAB, run BF-641, refresh evidence, or submit a Sleeper transaction.'
          if team_boundary_old not in text:
              raise SystemExit('BF-652 team boundary marker missing')
          text = text.replace(team_boundary_old, team_boundary_new, 1)

          waiver_head_old = '''function ConvertTo-WaiverHtml {
    param(
        [Parameter(Mandatory = $true)][string]$Bundle,
        [Parameter(Mandatory = $true)][string]$Summary
    )'''
          waiver_head_new = '''function ConvertTo-WaiverHtml {
    param(
        [Parameter(Mandatory = $true)][string]$Bundle,
        [Parameter(Mandatory = $true)][string]$Summary,
        [Parameter(Mandatory = $true)][string]$RosterContext
    )'''
          if waiver_head_old not in text:
              raise SystemExit('BF-652 waiver signature marker missing')
          text = text.replace(waiver_head_old, waiver_head_new, 1)

          waiver_current_old = '''    $current = Get-CurrentGovernedAddView -Bundle $Bundle -Summary $Summary
    $target = $current.Target'''
          waiver_current_new = '''    $pair = Get-CurrentGovernedTransactionPairView -Bundle $Bundle -RosterContext $RosterContext -Summary $Summary
    $current = $pair.AddCurrent
    $target = $pair.Target'''
          if waiver_current_old not in text:
              raise SystemExit('BF-652 waiver current marker missing')
          text = text.replace(waiver_current_old, waiver_current_new, 1)

          waiver_copy_old = '''        $currentCopy = if ($isCurrent) { '<div class="current-copy">Already-audited current ADD &middot; this marker is not a board rank.</div>' } else { "" }'''
          waiver_copy_new = '''        $currentCopy = if ($isCurrent) { "<div class=`"current-copy`">Already-audited current ADD &middot; this marker is not a board rank.</div><div class=`"pair-context`"><strong>Paired audited DROP</strong><div>$(ConvertTo-HtmlText $pair.Drop.Name)</div><div class=`"pair-meta`">$(ConvertTo-HtmlText $pair.Drop.Position) &middot; NFL $(ConvertTo-HtmlText $pair.Drop.Team) &middot; Sleeper $(ConvertTo-HtmlText $pair.Drop.SleeperId)</div><div class=`"current-copy`">Butler's already-audited current transaction &middot; not a board rank or new selection.</div><div class=`"actions`"><a class=`"button`" href=`"/team`">View paired DROP</a></div></div>" } else { "" }'''
          if waiver_copy_old not in text:
              raise SystemExit('BF-652 waiver current-copy marker missing')
          text = text.replace(waiver_copy_old, waiver_copy_new, 1)

          waiver_tech_old = '<div>Current ADD Sleeper ID: $(ConvertTo-HtmlText $current.SleeperId)</div><div>BF-629 current gate:'
          waiver_tech_new = '<div>Current ADD Sleeper ID: $(ConvertTo-HtmlText $current.SleeperId)</div><div>Paired ADD Sleeper ID: $(ConvertTo-HtmlText $pair.AddSleeperId)</div><div>Paired DROP Sleeper ID: $(ConvertTo-HtmlText $pair.DropSleeperId)</div><div>BF-629 current gate:'
          if waiver_tech_old not in text:
              raise SystemExit('BF-652 waiver technical marker missing')
          text = text.replace(waiver_tech_old, waiver_tech_new, 1)

          waiver_disclaimer_old = 'If shown, <strong>Current governed ADD</strong> identifies the already-audited current add only; it does not alter BF-616 order or rank the board.'
          waiver_disclaimer_new = 'If shown, <strong>Current governed ADD</strong> identifies the already-audited current add and <strong>Paired audited DROP</strong> identifies only its exact audited counterpart; neither alters BF-616 order or ranks the board.'
          if waiver_disclaimer_old not in text:
              raise SystemExit('BF-652 waiver disclaimer marker missing')
          text = text.replace(waiver_disclaimer_old, waiver_disclaimer_new, 1)

          waiver_boundary_old = "identifies Butler's already-audited current ADD. It does not rerank candidates, weight market/depth/injury, score newcomers, pick a new winner, identify a new drop, set FAAB, run BF-641, refresh evidence, or submit a Sleeper transaction."
          waiver_boundary_new = "identifies Butler's already-audited current ADD and its exact paired audited DROP. It does not rerank candidates, weight market/depth/injury, score newcomers, pick a new winner/drop, set FAAB, run BF-641, refresh evidence, or submit a Sleeper transaction."
          if waiver_boundary_old not in text:
              raise SystemExit('BF-652 waiver boundary marker missing')
          text = text.replace(waiver_boundary_old, waiver_boundary_new, 1)

          team_route_old = '''                if ($path -eq "/team") {
                    $summary = Invoke-ButlerReadOnlySummary
                    $rosterContext = Invoke-ButlerReadOnlyRosterContext
                    $html = ConvertTo-TeamHtml -RosterContext $rosterContext -Summary $summary
                }'''
          team_route_new = '''                if ($path -eq "/team") {
                    $summary = Invoke-ButlerReadOnlySummary
                    $rosterContext = Invoke-ButlerReadOnlyRosterContext
                    $waiverBundle = Invoke-ButlerReadOnlyWaiverBoard
                    $html = ConvertTo-TeamHtml -RosterContext $rosterContext -Summary $summary -Bundle $waiverBundle
                }'''
          if team_route_old not in text:
              raise SystemExit('BF-652 team route marker missing')
          text = text.replace(team_route_old, team_route_new, 1)

          waiver_route_old = '''                elseif ($path -eq "/waivers") {
                    $summary = Invoke-ButlerReadOnlySummary
                    $waiverBundle = Invoke-ButlerReadOnlyWaiverBoard
                    $html = ConvertTo-WaiverHtml -Bundle $waiverBundle -Summary $summary
                }'''
          waiver_route_new = '''                elseif ($path -eq "/waivers") {
                    $summary = Invoke-ButlerReadOnlySummary
                    $waiverBundle = Invoke-ButlerReadOnlyWaiverBoard
                    $rosterContext = Invoke-ButlerReadOnlyRosterContext
                    $html = ConvertTo-WaiverHtml -Bundle $waiverBundle -Summary $summary -RosterContext $rosterContext
                }'''
          if waiver_route_old not in text:
              raise SystemExit('BF-652 waiver route marker missing')
          text = text.replace(waiver_route_old, waiver_route_new, 1)

          banner_old = 'Write-Host "BF-643/BF-644/BF-645/BF-646/BF-647/BF-648/BF-649 Butler Dashboard"'
          banner_new = 'Write-Host "BF-643 through BF-652 Butler Dashboard"'
          if banner_old not in text:
              raise SystemExit('BF-652 banner marker missing')
          text = text.replace(banner_old, banner_new, 1)

          text.encode('ascii')
          path.write_text(text, encoding='ascii', newline='\n')
          PY
      - name: Commit dashboard patch
        shell: bash
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1
          git commit -m "BF-652: pair current governed ADD and DROP"
          git push origin HEAD:bf-652-pair-current-add-drop
