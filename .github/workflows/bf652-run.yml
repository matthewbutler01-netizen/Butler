name: BF-652 Run

on:
  push:
    branches:
      - bf-652-pair-current-add-drop
    paths:
      - .github/workflows/bf652-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-652-pair-current-add-drop
      - name: Apply BF-652 dashboard patch
        run: python .github/bf652_patch.py
      - name: Commit dashboard patch
        shell: bash
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1
          git commit -m "BF-652: pair current governed ADD and DROP"
          git push origin HEAD:bf-652-pair-current-add-drop
