name: BF-659 Temporary Patch Runner

on:
  push:
    branches:
      - bf-659-post-transaction-explanation-capture

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf-659-post-transaction-explanation-capture
      - name: Execute BF-659 patch with robust constructor matcher
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/bf659-patch.yml').read_text()
          start_marker = '          from pathlib import Path\n'
          end_marker = '      - name: Commit BF-659 wiring\n'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines()) + '\n'

          block_start = script.index("production_old = '''")
          block_end = script.index("ctor_old = '''", block_start)
          replacement = '''import re
          production_new = """        this.evidenceSource = recommendation ->
              new SleeperLiveWaiverCrossPositionTransactionEvidence(database).explain(recommendation);
          this.postTransactionReplaySource = (target, audit) -> {
              var replay = new SleeperLiveWaiverPostTransactionRecommendationReplay(database).replay(target, audit);
              return new PostTransactionReplay(replay.recommendation(), replay.evidence());
          };
          this.clock = Clock.systemUTC();"""
          production_pattern = re.compile(
              r'        this\\.evidenceSource = recommendation ->\\n\\s+new SleeperLiveWaiverCrossPositionTransactionEvidence\\(database\\)\\.explain\\(recommendation\\);\\n        this\\.clock = Clock\\.systemUTC\\(\\);')
          capture, production_count = production_pattern.subn(production_new, capture, count=1)
          if production_count != 1:
              raise SystemExit('capture production constructor regex marker missing')
          '''
          script = script[:block_start] + replacement + script[block_end:]
          exec(compile(script, 'bf659-embedded-patch.py', 'exec'))
      - name: Commit BF-659 wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverFinalRecommendationBundle.java \
                  bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCapture.java \
                  bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverPostTransactionRecommendationReplay.java \
                  bet/bet-cli/src/test/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCaptureTest.java
          git commit -m "BF-659 wire guarded post-transaction explanation replay"
          git push origin HEAD:bf-659-post-transaction-explanation-capture
