name: Build

on:
  push:
    branches:
      - main
      - startsit-review-action-summary
      - bf1515-manager-decision-clarity
      - bf1515-lineup-fingerprint
      - bf1515-dashboard-saved-review-proof
      - bf1519-explicit-lineup-change-notice
      - bf1520-matchup-live-roster-proof
      - bf1521-waiver-no-verified-move-clarity
      - bf1522-waiver-history-week-labels
      - bf1523-v04-pin-tested-beta
      - bf1524-history-player-identity-hold
      - bf1525-waiver-evidence-age
      - bf1526-v04-beta-pack-verified-waiver
      - bf1527-one-click-exact-checkout
      - bf1528-week-rollover-readonly-gate
      - bf1529-governed-week-rollover-refresh
      - bf1534-v04-week-rollover-beta-pack
      - bf1536-v04-evidence-viewport-browser-proof
      - bf1537-v04-shared-waiver-audit-cooldown
      - bf1538-v04-shared-refresh-one-click-beta
      - bf1540-v04-cross-tab-one-click-beta
      - bf1539-v04-cross-tab-onopen-refresh-lock
      - bf1542-v04-verified-app-pack-integration
      - bf-v04-fantasy-workflow-study
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --dependency-verification=strict clean build

      - name: Verify dependency lockfile is current
        run: |
          ./gradlew --dependency-verification=strict :bet:bet-cli:dependencies --write-locks
          git diff --exit-code -- bet/bet-cli/gradle.lockfile
