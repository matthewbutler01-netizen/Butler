name: BF-537 patch

on:
  push:
    branches:
      - bf-537-improve-franchise-rank-terminal-readability
    paths:
      - .github/workflows/bf537-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: bf-537-improve-franchise-rank-terminal-readability
      - name: Apply BF-537 terminal readability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerApp.java')
          text = app.read_text(encoding='utf-8')
          old = '        for (var team : report.teams()) {\n            System.out.printf("%d. %s  total=%.2f  players=%.2f  picks=%.2f  assets=%d players + %d picks  dates=%s  [%s]%n",\n                team.rank(), team.teamName(), team.totalAssetValue(), team.playerValue(), team.draftPickValue(),\n                team.valuedPlayers(), team.valuedDraftPicks(),\n                valueDates(team.oldestValueDate(), team.latestValueDate()), team.teamId());\n        }\n    }\n'
          new = '        for (var team : report.teams()) {\n            printFranchiseRankingTeam(team);\n        }\n    }\n\n    static void printFranchiseRankingTeam(FranchiseValueRankingAnalyzer.FranchiseValue team) {\n        if (team == null) throw new IllegalArgumentException("team must not be null");\n        System.out.printf("%d. %s  total=%.2f  players=%.2f  picks=%.2f%n",\n            team.rank(), team.teamName(), team.totalAssetValue(), team.playerValue(), team.draftPickValue());\n        System.out.printf("  assets: players=%d  picks=%d  dates=%s  team-id=%s%n",\n            team.valuedPlayers(), team.valuedDraftPicks(),\n            valueDates(team.oldestValueDate(), team.latestValueDate()), team.teamId());\n    }\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected franchise ranking output block once, found {text.count(old)}')
          app.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerAppTest.java')
          text = test.read_text(encoding='utf-8')
          import_anchor = 'package io.butler.bet.cli;\n\nimport org.junit.jupiter.api.Test;\n'
          import_replacement = 'package io.butler.bet.cli;\n\nimport io.butler.bet.intelligence.FranchiseValueRankingAnalyzer;\nimport org.junit.jupiter.api.Test;\n\nimport java.io.ByteArrayOutputStream;\nimport java.io.PrintStream;\nimport java.nio.charset.StandardCharsets;\nimport java.time.LocalDate;\n'
          if text.count(import_anchor) != 1:
              raise SystemExit(f'expected ButlerAppTest import anchor once, found {text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)
          marker = '    @Test\n    void parsesMixedTradeAssetsAndKeepsBarePlayerCompatibility() {'
          addition = (
              '    @Test\n'
              '    void rendersFranchiseRankingAsCompactPrimaryAndDetailRows() {\n'
              '        var team = new FranchiseValueRankingAnalyzer.FranchiseValue(\n'
              '            3, "team-123", "Love: JT, Jeanty &Javonte",\n'
              '            1234.50, 678.25, 1912.75, 25, 6,\n'
              '            LocalDate.of(2026, 8, 30), LocalDate.of(2026, 9, 2));\n'
              '\n'
              '        String output = capture(() -> ButlerApp.printFranchiseRankingTeam(team));\n'
              '        String[] lines = output.strip().split("\\\\R");\n'
              '\n'
              '        assertEquals(2, lines.length);\n'
              '        assertEquals(\n'
              '            "3. Love: JT, Jeanty &Javonte  total=1912.75  players=1234.50  picks=678.25", lines[0]);\n'
              '        assertEquals(\n'
              '            "  assets: players=25  picks=6  dates=2026-08-30 -> 2026-09-02  team-id=team-123", lines[1]);\n'
              '        assertTrue(lines[0].length() <= 120);\n'
              '    }\n'
              '\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f'expected ButlerAppTest insertion point once, found {text.count(marker)}')
          text = text.replace(marker, addition + marker, 1)
          helper_marker = '\n}\n'
          helper = (
              '\n    private static String capture(Runnable runnable) {\n'
              '        PrintStream original = System.out;\n'
              '        ByteArrayOutputStream buffer = new ByteArrayOutputStream();\n'
              '        try {\n'
              '            System.setOut(new PrintStream(buffer, true, StandardCharsets.UTF_8));\n'
              '            runnable.run();\n'
              '        } finally {\n'
              '            System.setOut(original);\n'
              '        }\n'
              '        return buffer.toString(StandardCharsets.UTF_8);\n'
              '    }\n'
          )
          if not text.endswith(helper_marker):
              raise SystemExit('expected ButlerAppTest class ending')
          text = text[:-2] + helper + '}\n'
          test.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/bf537-patch.yml
      - name: Commit BF-537 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerApp.java bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerAppTest.java .github/workflows/bf537-patch.yml
          git commit -m "BF-537: improve franchise-rank terminal readability"
          git push origin HEAD:bf-537-improve-franchise-rank-terminal-readability
