name: BF-742 Shared Dashboard Worker

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/butler-core-bf742-transform.ps1'
      - 'scripts/butler-persistent-core-worker.ps1'
      - 'scripts/butler-dashboard-bf715-transform.ps1'
      - 'scripts/butler-app-shell-core-single.ps1'
      - 'scripts/butler-dashboard.ps1'
      - 'scripts/butler-acceptance.cmd'
      - 'bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerReadOnlyJvmWorker.java'
      - 'bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerReadOnlyJvmWorkerBf740Test.java'
      - 'bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerPersistentCoreWorkerCanaryBf740Test.java'
      - '.github/workflows/bf740-persistent-core-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/butler-core-bf742-transform.ps1'
      - 'scripts/butler-persistent-core-worker.ps1'
      - 'scripts/butler-dashboard-bf715-transform.ps1'
      - 'scripts/butler-app-shell-core-single.ps1'
      - 'scripts/butler-dashboard.ps1'
      - 'scripts/butler-acceptance.cmd'
      - 'bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerReadOnlyJvmWorker.java'
      - 'bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerReadOnlyJvmWorkerBf740Test.java'
      - 'bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerPersistentCoreWorkerCanaryBf740Test.java'
      - '.github/workflows/bf740-persistent-core-worker.yml'

concurrency:
  group: bf742-shared-dashboard-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staged-runtime:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Exercise BF-742 default shared-worker staging under Windows PowerShell 5.1
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bf742-default-runtime'
          if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $dashboard = Join-Path $root 'butler-dashboard.ps1'
          $core = Join-Path $root 'butler-app-shell-core-single.ps1'
          Copy-Item '.\scripts\butler-dashboard.ps1' $dashboard -Force
          Copy-Item '.\scripts\butler-app-shell-core-single.ps1' $core -Force

          $previous = $env:BUTLER_APP_PERSISTENT_CORE_WORKER
          try {
              Remove-Item Env:BUTLER_APP_PERSISTENT_CORE_WORKER -ErrorAction SilentlyContinue
              & '.\scripts\butler-dashboard-bf715-transform.ps1' -DashboardPath $dashboard
          }
          finally {
              if ($null -eq $previous) {
                  Remove-Item Env:BUTLER_APP_PERSISTENT_CORE_WORKER -ErrorAction SilentlyContinue
              }
              else {
                  $env:BUTLER_APP_PERSISTENT_CORE_WORKER = $previous
              }
          }

          $helper = Join-Path $root 'butler-persistent-core-worker.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
              Write-Error 'BF-742 BLOCKED: default staging did not copy the persistent worker helper.'
              exit 1
          }

          $coreText = [System.IO.File]::ReadAllText($core)
          $dashboardText = [System.IO.File]::ReadAllText($dashboard)

          foreach ($required in @(
              'New-Bf742DashboardToken',
              'BUTLER_APP_INTERNAL_DASHBOARD_TOKEN',
              'X-Butler-Internal-Token',
              '/__butler/internal/team-bundle',
              '/__butler/internal/league-overview'
          )) {
              if (-not $coreText.Contains($required)) {
                  Write-Error ("BF-742 BLOCKED: staged core is missing {0}." -f $required)
                  exit 1
              }
          }
          if ($coreText.Contains('Start-Bf740PersistentCoreWorker') -or $coreText.Contains('Stop-Bf740PersistentCoreWorker')) {
              Write-Error 'BF-742 BLOCKED: staged core still owns a JVM worker.'
              exit 1
          }

          foreach ($required in @(
              '$script:Bf740PersistentCoreWorkerCanary = $true',
              "Invoke-Bf740PersistentCoreWorker -Operation 'LATEST_SUMMARY'",
              "Invoke-Bf740PersistentCoreWorker -Operation 'WAIVER_DASHBOARD_BUNDLE'",
              "Invoke-Bf740PersistentCoreWorker -Operation 'EXPLANATION_LOOKUP'",
              'Start-Bf740PersistentCoreWorker',
              'Stop-Bf740PersistentCoreWorker',
              'X-Butler-Internal-Token',
              '/__butler/internal/team-bundle',
              '/__butler/internal/league-overview',
              'StatusCode 403'
          )) {
              if (-not $dashboardText.Contains($required)) {
                  Write-Error ("BF-742 BLOCKED: staged dashboard is missing {0}." -f $required)
                  exit 1
              }
          }

          foreach ($file in @($dashboard, $core, $helper)) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error ("{0}:{1}:{2}: {3}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
                  exit 1
              }
          }

          Write-Host 'BF-742 default staging produced one dashboard-owned worker with authenticated parent-core access.'

      - name: Exercise BF-742 emergency opt-out under Windows PowerShell 5.1
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bf742-disabled-runtime'
          if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $dashboard = Join-Path $root 'butler-dashboard.ps1'
          $core = Join-Path $root 'butler-app-shell-core-single.ps1'
          Copy-Item '.\scripts\butler-dashboard.ps1' $dashboard -Force
          Copy-Item '.\scripts\butler-app-shell-core-single.ps1' $core -Force

          $previous = $env:BUTLER_APP_PERSISTENT_CORE_WORKER
          try {
              $env:BUTLER_APP_PERSISTENT_CORE_WORKER = '0'
              & '.\scripts\butler-dashboard-bf715-transform.ps1' -DashboardPath $dashboard
          }
          finally {
              if ($null -eq $previous) {
                  Remove-Item Env:BUTLER_APP_PERSISTENT_CORE_WORKER -ErrorAction SilentlyContinue
              }
              else {
                  $env:BUTLER_APP_PERSISTENT_CORE_WORKER = $previous
              }
          }

          $helper = Join-Path $root 'butler-persistent-core-worker.ps1'
          if (Test-Path -LiteralPath $helper) {
              Write-Error 'BF-742 BLOCKED: explicit opt-out still copied the persistent worker helper.'
              exit 1
          }

          $coreText = [System.IO.File]::ReadAllText($core)
          $dashboardText = [System.IO.File]::ReadAllText($dashboard)
          foreach ($forbidden in @(
              'Bf742DashboardToken',
              'X-Butler-Internal-Token',
              '/__butler/internal/team-bundle',
              'Start-Bf740PersistentCoreWorker'
          )) {
              if ($coreText.Contains($forbidden) -or $dashboardText.Contains($forbidden)) {
                  Write-Error ("BF-742 BLOCKED: explicit opt-out still staged shared-worker contract {0}." -f $forbidden)
                  exit 1
              }
          }
          if (-not $dashboardText.Contains('Invoke-ButlerReadOnlyWaiverEvidenceBundle')) {
              Write-Error 'BF-742 BLOCKED: worker opt-out incorrectly disabled independent BF-715 waiver staging.'
              exit 1
          }

          foreach ($file in @($dashboard, $core)) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error ("{0}:{1}:{2}: {3}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
                  exit 1
              }
          }

          Write-Host 'BF-742 emergency opt-out preserved the pre-worker core while retaining BF-715 waiver staging.'
