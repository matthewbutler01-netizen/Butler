name: BF-653 Apply

on:
  push:
    branches:
      - bf-653-governed-explanation-companion
    paths:
      - .github/workflows/bf653-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-653-governed-explanation-companion
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply BF-653 patch
        run: python .github/bf653_patch.py
      - name: Compile BF-653 sources and tests
        run: ./gradlew :bet:bet-cli:compileTestJava
      - name: Commit BF-653 wiring
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add bet/bet-cli/build.gradle.kts bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCapture.java
          git commit -m "BF-653: wire explanation capture and lookup tasks"
          git push origin HEAD:bf-653-governed-explanation-companion
