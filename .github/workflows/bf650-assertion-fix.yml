name: BF-650 Assertion Fix
on:
  push:
    branches: [bf-650-powershell51-ascii-dashboard]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-650-powershell51-ascii-dashboard
          persist-credentials: true
      - name: Update HTML entity source assertions
        run: python -c "from pathlib import Path; ps=[Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardScriptTest.java'),Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf649ScriptTest.java')]; [(lambda p: p.write_text(p.read_text(encoding='utf-8').replace(' · ',' &middot; '),encoding='utf-8'))(p) for p in ps]"
      - name: Commit assertion updates
        run: |
          if git diff --quiet -- bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardScriptTest.java bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf649ScriptTest.java; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardScriptTest.java bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf649ScriptTest.java
          git commit -m "BF-650: update entity-based dashboard assertions"
          git push origin HEAD:bf-650-powershell51-ascii-dashboard
