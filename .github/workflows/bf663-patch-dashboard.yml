name: BF-663 Patch Dashboard

on:
  push:
    branches:
      - bf-663-decision-aware-copy
    paths:
      - .github/workflows/bf663-patch-dashboard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact BF-663 dashboard patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/butler-dashboard.ps1')
          text = path.read_text(encoding='ascii')

          needle = '    $verification = Get-VerificationCopy -Bf629 $bf629 -Bf631 $bf631\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one verification assignment, found {text.count(needle)}')
          replacement = needle + '    $explanationHeading = if ($state -ceq "NO_TRANSACTION_TO_ACT_ON") { "Why no transaction?" } else { "Why this move?" }\n' + '    $rosterSafetyDetail = if ($bf629 -ceq "NO_TRANSACTION_TO_REVALIDATE") { "BF-629 confirms this audited decision has no transaction requiring live roster revalidation." } else { "BF-629 checks whether the audited move is still valid against Sleeper." }\n'
          text = text.replace(needle, replacement, 1)

          heading = '  <h2>Why this move?</h2>'
          if text.count(heading) != 2:
              raise SystemExit(f'expected two fixed explanation headings, found {text.count(heading)}')
          text = text.replace(heading, '  <h2>$(ConvertTo-HtmlText $explanationHeading)</h2>')

          safety = '<small>BF-629 checks whether the audited move is still valid against Sleeper.</small>'
          if text.count(safety) != 1:
              raise SystemExit(f'expected one BF-629 fixed safety detail, found {text.count(safety)}')
          text = text.replace(safety, '<small>$(ConvertTo-HtmlText $rosterSafetyDetail)</small>', 1)

          path.write_text(text, encoding='ascii', newline='\n')
          PY
      - name: Remove temporary patch workflow and commit
        shell: bash
        run: |
          rm .github/workflows/bf663-patch-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1 bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf663ScriptTest.java .github/workflows/bf663-patch-dashboard.yml
          git commit -m "BF-663: make no-transaction dashboard copy decision-aware"
          git push origin HEAD:bf-663-decision-aware-copy
