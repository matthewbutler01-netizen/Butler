name: BF-659 Temporary Patch

on:
  push:
    branches:
      - bf-659-post-transaction-explanation-capture

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf-659-post-transaction-explanation-capture
      - name: Wire BF-659 replay
        shell: python
        run: |
          from pathlib import Path

          final_path = Path('bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverFinalRecommendationBundle.java')
          final = final_path.read_text()
          marker = '    private MethodologyReport methodology(SleeperLiveWaiverComparisonExecutionBundle.BundleReport bundle) {'
          if marker not in final:
              raise SystemExit('final bundle methodology marker missing')
          replay_method = '''    /** BF-659 replays the frozen final method against an explicitly reconstructed pre-transaction roster frame. */
              RecommendationReport replay(
                  String leagueId,
                  String sleeperOwnerId,
                  SleeperLiveWaiverComparisonExecutionBundle.BundleReport bundle,
                  ReplayFreshnessFrame freshness) throws SQLException {
                  String normalizedLeagueId = requireText(leagueId, "leagueId");
                  String normalizedOwnerId = requireText(sleeperOwnerId, "sleeperOwnerId");
                  validateBundle(bundle, normalizedLeagueId, normalizedOwnerId);
                  validateReplayFreshness(bundle, freshness, normalizedLeagueId, normalizedOwnerId);

                  MethodologyReport methodology = methodology(bundle);
                  SelectionReport selection = select(bundle);
                  if (selection.state() != SelectionState.UNIQUE_ADD_DROP_SELECTED) {
                      return new RecommendationReport(
                          BF620_POLICY_ID, normalizedLeagueId, normalizedOwnerId,
                          bundle.comparisons().marketSnapshotId(), bundle.comparisons().waiverSnapshotId(),
                          bundle.comparisons().sleeperLeagueId(), bundle.comparisons().rosterId(),
                          methodology, selection, freshness.providerSeason(), freshness.providerStatus(), freshness.providerLeg(),
                          null, null, newcomerAlternatives(bundle), RecommendationState.NO_GOVERNED_TRANSACTION);
                  }

                  var add = Objects.requireNonNull(selection.selectedAdd());
                  var drop = Objects.requireNonNull(selection.selectedDrop());
                  validateSelectedPairAgainstReplayAndSnapshot(bundle, freshness, add, drop);
                  return new RecommendationReport(
                      BF620_POLICY_ID, normalizedLeagueId, normalizedOwnerId,
                      bundle.comparisons().marketSnapshotId(), bundle.comparisons().waiverSnapshotId(),
                      bundle.comparisons().sleeperLeagueId(), bundle.comparisons().rosterId(),
                      methodology, selection, freshness.providerSeason(), freshness.providerStatus(), freshness.providerLeg(),
                      add, drop, newcomerAlternatives(bundle), RecommendationState.RECOMMEND_ADD_DROP);
              }

          '''
          final = final.replace(marker, replay_method + marker, 1)

          marker2 = '    private static List<SleeperLiveWaiverComparisonExecutionBundle.ShortlistEntry> historicalFinalists('
          if marker2 not in final:
              raise SystemExit('final bundle historical marker missing')
          replay_validation = '''    private void validateSelectedPairAgainstReplayAndSnapshot(
                  SleeperLiveWaiverComparisonExecutionBundle.BundleReport bundle,
                  ReplayFreshnessFrame freshness,
                  SelectedPlayer add,
                  SelectedPlayer drop) throws SQLException {
                  boolean dropReplay = freshness.targetPlayers().stream().anyMatch(value ->
                      value.sleeperPlayerId().equals(drop.sleeperPlayerId())
                          && SleeperLiveWaiverCandidateRosterComparisonMethodology.eligibleReplacementSlot(value.rosterSlot()));
                  if (!dropReplay) {
                      throw new IllegalStateException("BF-659 BLOCKED: selected drop is not on reconstructed target BENCH/RESERVE roster");
                  }
                  if (freshness.targetPlayers().stream().anyMatch(value -> value.sleeperPlayerId().equals(add.sleeperPlayerId()))) {
                      throw new IllegalStateException("BF-659 BLOCKED: selected add appears on reconstructed pre-transaction target roster");
                  }

                  List<LiveWaiverSnapshotRepository.Entry> entries = snapshotEntriesSource.load(bundle.comparisons().waiverSnapshotId());
                  Map<String, LiveWaiverSnapshotRepository.Entry> byId = new LinkedHashMap<>();
                  for (var entry : entries) {
                      if (byId.putIfAbsent(entry.sleeperPlayerId(), entry) != null) {
                          throw new IllegalStateException("BF-659 BLOCKED: duplicate BF-602 snapshot identity " + entry.sleeperPlayerId());
                      }
                  }
                  var addSnapshot = byId.get(add.sleeperPlayerId());
                  var dropSnapshot = byId.get(drop.sleeperPlayerId());
                  if (addSnapshot == null || !addSnapshot.freeAgent() || addSnapshot.rostered() || !addSnapshot.leagueEligible()) {
                      throw new IllegalStateException("BF-659 BLOCKED: selected add was not an exact league-eligible free agent in audited BF-602 snapshot");
                  }
                  if (dropSnapshot == null || !dropSnapshot.rostered() || dropSnapshot.freeAgent()) {
                      throw new IllegalStateException("BF-659 BLOCKED: selected drop was not rostered in audited BF-602 snapshot");
                  }
                  boolean historicalShortlist = bundle.shortlist().shortlist().stream().anyMatch(value ->
                      value.lane() == SleeperLiveWaiverComparisonExecutionBundle.ShortlistLane.HISTORICAL_DIRECTIONAL
                          && value.candidate().sleeperPlayerId().equals(add.sleeperPlayerId()));
                  if (!historicalShortlist) {
                      throw new IllegalStateException("BF-659 BLOCKED: selected add is absent from replayed BF-616 historical shortlist");
                  }
                  boolean backedPair = bundle.comparisons().pairs().stream().anyMatch(value ->
                      value.candidate().sleeperPlayerId().equals(add.sleeperPlayerId())
                          && value.roster().sleeperPlayerId().equals(drop.sleeperPlayerId())
                          && value.state() == SleeperLiveWaiverComparisonExecutionBundle.PairState.CANDIDATE_DIRECTIONALLY_SUPPORTED);
                  if (!backedPair) {
                      throw new IllegalStateException("BF-659 BLOCKED: selected add/drop lacks replayed BF-615 candidate-supported pair evidence");
                  }
              }

              private static void validateReplayFreshness(
                  SleeperLiveWaiverComparisonExecutionBundle.BundleReport bundle,
                  ReplayFreshnessFrame freshness,
                  String leagueId,
                  String ownerId) {
                  Objects.requireNonNull(freshness, "BF-659 replay freshness must not be null");
                  if (!bundle.comparisons().marketSnapshotId().equals(freshness.marketSnapshotId())
                      || !bundle.comparisons().waiverSnapshotId().equals(freshness.waiverSnapshotId())
                      || !bundle.comparisons().sleeperLeagueId().equals(freshness.sleeperLeagueId())
                      || bundle.comparisons().rosterId() != freshness.rosterId()) {
                      throw new IllegalStateException("BF-659 BLOCKED: reconstructed freshness lineage differs from BF-615-617 replay frame");
                  }
                  if (freshness.providerSeason() != 2026 || !"in_season".equals(freshness.providerStatus())) {
                      throw new IllegalStateException("BF-659 BLOCKED: reconstructed freshness frame is not in-season 2026");
                  }
                  if (freshness.targetPlayers().isEmpty()) {
                      throw new IllegalStateException("BF-659 BLOCKED: reconstructed target roster is empty");
                  }
              }

          '''
          final = final.replace(marker2, replay_validation + marker2, 1)

          marker3 = '    public enum MethodologyState { FINAL_SELECTION_METHOD_FROZEN }'
          if marker3 not in final:
              raise SystemExit('final bundle enum marker missing')
          records = '''    record ReplayTargetPlayer(String sleeperPlayerId, String rosterSlot) {
              ReplayTargetPlayer {
                  sleeperPlayerId = requireText(sleeperPlayerId, "replay Sleeper player id");
                  rosterSlot = requireText(rosterSlot, "replay roster slot");
              }
          }

              record ReplayFreshnessFrame(
                  String marketSnapshotId,
                  String waiverSnapshotId,
                  String sleeperLeagueId,
                  int rosterId,
                  int providerSeason,
                  String providerStatus,
                  Integer providerLeg,
                  List<ReplayTargetPlayer> targetPlayers) {
                  ReplayFreshnessFrame {
                      marketSnapshotId = requireText(marketSnapshotId, "replay market snapshot id");
                      waiverSnapshotId = requireText(waiverSnapshotId, "replay waiver snapshot id");
                      sleeperLeagueId = requireText(sleeperLeagueId, "replay Sleeper league id");
                      providerStatus = requireText(providerStatus, "replay provider status");
                      if (rosterId <= 0) throw new IllegalArgumentException("replay roster id must be positive");
                      targetPlayers = List.copyOf(Objects.requireNonNull(targetPlayers, "replay target players must not be null"));
                  }
              }

          '''
          final = final.replace(marker3, records + marker3, 1)
          final_path.write_text(final)

          capture_path = Path('bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCapture.java')
          capture = capture_path.read_text()
          capture = capture.replace(
              '    private final EvidenceSource evidenceSource;\n    private final Clock clock;',
              '    private final EvidenceSource evidenceSource;\n    private final PostTransactionReplaySource postTransactionReplaySource;\n    private final Clock clock;', 1)
          production_old = '''        this.evidenceSource = recommendation ->
                  new SleeperLiveWaiverCrossPositionTransactionEvidence(database).explain(recommendation);
              this.clock = Clock.systemUTC();'''
          production_new = '''        this.evidenceSource = recommendation ->
                  new SleeperLiveWaiverCrossPositionTransactionEvidence(database).explain(recommendation);
              this.postTransactionReplaySource = (target, audit) -> {
                  var replay = new SleeperLiveWaiverPostTransactionRecommendationReplay(database).replay(target, audit);
                  return new PostTransactionReplay(replay.recommendation(), replay.evidence());
              };
              this.clock = Clock.systemUTC();'''
          if production_old not in capture:
              raise SystemExit('capture production constructor marker missing')
          capture = capture.replace(production_old, production_new, 1)
          ctor_old = '''    SleeperLiveWaiverGovernedExplanationCapture(
                  GovernedRecommendationAuditRepository auditRepository,
                  GovernedRecommendationExplanationRepository explanationRepository,
                  RecommendationSource recommendationSource,
                  EvidenceSource evidenceSource,
                  Clock clock) {
                  this.auditRepository = Objects.requireNonNull(auditRepository, "auditRepository must not be null");
                  this.explanationRepository = Objects.requireNonNull(explanationRepository, "explanationRepository must not be null");
                  this.recommendationSource = Objects.requireNonNull(recommendationSource, "recommendationSource must not be null");
                  this.evidenceSource = Objects.requireNonNull(evidenceSource, "evidenceSource must not be null");
                  this.clock = Objects.requireNonNull(clock, "clock must not be null");
              }'''
          ctor_new = '''    SleeperLiveWaiverGovernedExplanationCapture(
                  GovernedRecommendationAuditRepository auditRepository,
                  GovernedRecommendationExplanationRepository explanationRepository,
                  RecommendationSource recommendationSource,
                  EvidenceSource evidenceSource,
                  Clock clock) {
                  this(auditRepository, explanationRepository, recommendationSource, evidenceSource, clock, null);
              }

              SleeperLiveWaiverGovernedExplanationCapture(
                  GovernedRecommendationAuditRepository auditRepository,
                  GovernedRecommendationExplanationRepository explanationRepository,
                  RecommendationSource recommendationSource,
                  EvidenceSource evidenceSource,
                  Clock clock,
                  PostTransactionReplaySource postTransactionReplaySource) {
                  this.auditRepository = Objects.requireNonNull(auditRepository, "auditRepository must not be null");
                  this.explanationRepository = Objects.requireNonNull(explanationRepository, "explanationRepository must not be null");
                  this.recommendationSource = Objects.requireNonNull(recommendationSource, "recommendationSource must not be null");
                  this.evidenceSource = Objects.requireNonNull(evidenceSource, "evidenceSource must not be null");
                  this.postTransactionReplaySource = postTransactionReplaySource;
                  this.clock = Objects.requireNonNull(clock, "clock must not be null");
              }'''
          if ctor_old not in capture:
              raise SystemExit('capture test constructor marker missing')
          capture = capture.replace(ctor_old, ctor_new, 1)
          source_old = '''        SleeperLiveWaiverFinalRecommendationBundle.RecommendationReport recommendation =
                  recommendationSource.run(target.butlerLeagueId(), target.sleeperUserId());
              reconcileAudit(audit, recommendation);
              ExplanationPayload payload = explanationPayload(recommendation, evidenceSource);'''
          source_new = '''        SleeperLiveWaiverFinalRecommendationBundle.RecommendationReport recommendation;
              EvidenceSource payloadEvidenceSource = evidenceSource;
              try {
                  recommendation = recommendationSource.run(target.butlerLeagueId(), target.sleeperUserId());
              } catch (IllegalStateException liveFailure) {
                  if (!isPostTransactionRosterDrift(liveFailure) || postTransactionReplaySource == null) {
                      throw liveFailure;
                  }
                  PostTransactionReplay replay = postTransactionReplaySource.replay(target, audit);
                  recommendation = Objects.requireNonNull(replay.recommendation(), "BF-659 replay recommendation must not be null");
                  payloadEvidenceSource = ignored -> {
                      if (replay.evidence() == null) {
                          throw new IllegalStateException("BF-659 BLOCKED: cross-position replay evidence is missing");
                      }
                      return replay.evidence();
                  };
              }
              reconcileAudit(audit, recommendation);
              ExplanationPayload payload = explanationPayload(recommendation, payloadEvidenceSource);'''
          if source_old not in capture:
              raise SystemExit('capture source marker missing')
          capture = capture.replace(source_old, source_new, 1)
          helper_marker = '    private static void validateVerifiedTarget(SleeperPersonalizedTargetService.VerifiedTarget target) {'
          if helper_marker not in capture:
              raise SystemExit('capture validation marker missing')
          helper = '''    private static boolean isPostTransactionRosterDrift(IllegalStateException failure) {
                  String message = failure.getMessage();
                  return message != null && message.startsWith(
                      "BF-610 BLOCKED: current roster membership drifted from BF-603/BF-602 frame;");
              }

          '''
          capture = capture.replace(helper_marker, helper + helper_marker, 1)
          interface_marker = '    record ExplanationPayload(String type, String text, String evidencePolicyId, String evidenceTrace) {}'
          if interface_marker not in capture:
              raise SystemExit('capture payload marker missing')
          new_interfaces = '''    @FunctionalInterface
              interface PostTransactionReplaySource {
                  PostTransactionReplay replay(
                      SleeperPersonalizedTargetService.VerifiedTarget target,
                      GovernedRecommendationAuditRepository.AuditRecord audit)
                      throws SQLException, IOException, InterruptedException;
              }

              record PostTransactionReplay(
                  SleeperLiveWaiverFinalRecommendationBundle.RecommendationReport recommendation,
                  SleeperLiveWaiverCrossPositionTransactionEvidence.EvidenceReport evidence) {
                  PostTransactionReplay {
                      Objects.requireNonNull(recommendation, "recommendation must not be null");
                  }
              }

          '''
          capture = capture.replace(interface_marker, new_interfaces + interface_marker, 1)
          capture_path.write_text(capture)

          replay_path = Path('bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverPostTransactionRecommendationReplay.java')
          replay = replay_path.read_text()
          call_old = '''        FrozenSnapshotFrame frozen = frozenSnapshotFrame(snapshotEntries, headers);
              ImportedFrame imported = importedFrame(target, frozen.rosteredIds());'''
          call_new = '''        FrozenSnapshotFrame frozen = frozenSnapshotFrame(snapshotEntries, headers);
              validateFrozenPair(frozen, audit);
              ImportedFrame imported = importedFrame(target, frozen.rosteredIds());'''
          if call_old not in replay:
              raise SystemExit('replay frozen marker missing')
          replay = replay.replace(call_old, call_new, 1)
          pair_marker = '    private ImportedFrame importedFrame('
          if pair_marker not in replay:
              raise SystemExit('replay imported marker missing')
          pair_method = '''    private static void validateFrozenPair(
                  FrozenSnapshotFrame frozen,
                  GovernedRecommendationAuditRepository.AuditRecord audit) {
                  var add = frozen.bySleeperId().get(audit.addSleeperPlayerId());
                  var drop = frozen.bySleeperId().get(audit.dropSleeperPlayerId());
                  if (add == null || !add.freeAgent() || add.rostered() || !add.leagueEligible()) {
                      throw blocked("audited add was not an exact league-eligible free agent in BF-602 frame");
                  }
                  if (drop == null || !drop.rostered() || drop.freeAgent()) {
                      throw blocked("audited drop was not rostered in BF-602 frame");
                  }
              }

          '''
          replay = replay.replace(pair_marker, pair_method + pair_marker, 1)
          replay_path.write_text(replay)

          test_path = Path('bet/bet-cli/src/test/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCaptureTest.java')
          test = test_path.read_text()
          test_marker = '    @Test\n    void conflictingCompanionPayloadForSameAuditIsRejected() throws Exception {'
          if test_marker not in test:
              raise SystemExit('capture test marker missing')
          new_tests = '''    @Test
              void postTransactionBf610RosterDriftUsesGuardedReplayAndCapturesExactAuditCompanion() throws Exception {
                  Database database = database();
                  var audits = new GovernedRecommendationAuditRepository(database);
                  var explanations = new GovernedRecommendationExplanationRepository(database);
                  var audit = persistAudit(audits, "audit-post-tx", "market-post-tx", "waiver-post-tx", "3214", "12493");
                  var replayRecommendation = recommendation("market-post-tx", "waiver-post-tx", "3214", "12493", List.of("TE"));
                  int[] replayCalls = {0};
                  var capture = new SleeperLiveWaiverGovernedExplanationCapture(
                      audits,
                      explanations,
                      (leagueId, ownerId) -> { throw new IllegalStateException(
                          "BF-610 BLOCKED: current roster membership drifted from BF-603/BF-602 frame; added=[3214] removed=[12493]; refresh BF-602/BF-603 and downstream live evidence before target-roster review"); },
                      ignored -> { throw new AssertionError("normal BF-625 source must not run after BF-659 replay"); },
                      Clock.fixed(Instant.parse("2026-09-09T11:30:00Z"), ZoneOffset.UTC),
                      (verifiedTarget, exactAudit) -> {
                          replayCalls[0]++;
                          assertEquals(audit, exactAudit);
                          return new SleeperLiveWaiverGovernedExplanationCapture.PostTransactionReplay(replayRecommendation, null);
                      });

                  var result = capture.capture(target(), audit.id());

                  assertEquals(1, replayCalls[0]);
                  assertEquals(GovernedRecommendationExplanationRepository.CaptureState.CAPTURED_VERIFIED, result.captureState());
                  assertEquals(SleeperLiveWaiverGovernedExplanationCapture.TYPE_SAME_POSITION, result.explanationType());
                  assertEquals(SleeperLiveWaiverGovernedExplanationCapture.SAME_POSITION_REASON, result.explanationText());
                  assertEquals("3214", result.addSleeperPlayerId());
                  assertEquals("12493", result.dropSleeperPlayerId());
                  assertEquals(audit, audits.findAllForLeague("butler-hardcore").stream()
                      .filter(value -> value.id().equals(audit.id())).findFirst().orElseThrow());
              }

              @Test
              void unrelatedLiveRecommendationFailureNeverTriggersPostTransactionReplay() throws Exception {
                  Database database = database();
                  var audits = new GovernedRecommendationAuditRepository(database);
                  var explanations = new GovernedRecommendationExplanationRepository(database);
                  var audit = persistAudit(audits, "audit-no-replay", "market-no-replay", "waiver-no-replay", "3214", "12493");
                  int[] replayCalls = {0};
                  var capture = new SleeperLiveWaiverGovernedExplanationCapture(
                      audits,
                      explanations,
                      (leagueId, ownerId) -> { throw new IllegalStateException("BF-620 BLOCKED: unrelated freshness failure"); },
                      ignored -> { throw new AssertionError("BF-625 must not run"); },
                      Clock.fixed(Instant.parse("2026-09-09T11:30:00Z"), ZoneOffset.UTC),
                      (verifiedTarget, exactAudit) -> {
                          replayCalls[0]++;
                          return new SleeperLiveWaiverGovernedExplanationCapture.PostTransactionReplay(
                              recommendation("market-no-replay", "waiver-no-replay", "3214", "12493", List.of("TE")), null);
                      });

                  IllegalStateException error = assertThrows(IllegalStateException.class,
                      () -> capture.capture(target(), audit.id()));

                  assertEquals("BF-620 BLOCKED: unrelated freshness failure", error.getMessage());
                  assertEquals(0, replayCalls[0]);
                  assertTrue(explanations.findByAuditId(audit.id()).isEmpty());
              }

          '''
          test = test.replace(test_marker, new_tests + test_marker, 1)
          test_path.write_text(test)
      - name: Commit BF-659 wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverFinalRecommendationBundle.java \
                  bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCapture.java \
                  bet/bet-cli/src/main/java/io/butler/bet/sleeper/SleeperLiveWaiverPostTransactionRecommendationReplay.java \
                  bet/bet-cli/src/test/java/io/butler/bet/sleeper/SleeperLiveWaiverGovernedExplanationCaptureTest.java
          git commit -m "BF-659 wire guarded post-transaction explanation replay"
          git push origin HEAD:bf-659-post-transaction-explanation-capture
