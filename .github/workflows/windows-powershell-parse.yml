name: Windows PowerShell Parse

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/butler-dashboard.ps1'
      - '.github/workflows/windows-powershell-parse.yml'
      - '.github/workflows/bf-661-apply.yml'

concurrency:
  group: windows-powershell-parse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - name: Check out BF-661 implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: bf-661-dashboard-no-transaction-explanation
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply BF-661 two-file patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/butler-dashboard.ps1')
          text = path.read_text(encoding='ascii')

          old = '        "STALE_DO_NOT_ACT" { return [pscustomobject]@{ Class="danger"; Headline="Do not act"; Copy="A hard safety gate failed. Keep this decision only for traceability until Butler produces a new governed result."; ActionTitle="Stop here"; ActionCopy="Do not make this move from the displayed audit. Butler must produce a new governed state before action." } }\n        default { return [pscustomobject]@{ Class="danger"; Headline="No actionable move"; Copy="Butler does not currently have a governed transaction that is safe to act on."; ActionTitle="No move to make"; ActionCopy="There is no currently governed add/drop action on this screen." } }'
          new = '        "STALE_DO_NOT_ACT" { return [pscustomobject]@{ Class="danger"; Headline="Do not act"; Copy="A hard safety gate failed. Keep this decision only for traceability until Butler produces a new governed result."; ActionTitle="Stop here"; ActionCopy="Do not make this move from the displayed audit. Butler must produce a new governed state before action." } }\n        "NO_TRANSACTION_TO_ACT_ON" { return [pscustomobject]@{ Class="done"; Headline="No governed transaction"; Copy="Butler\'s governed evaluation did not authorize an add/drop transaction for this audit."; ActionTitle="No move to make"; ActionCopy="Keep the audited no-transaction decision for traceability. There is no ADD/DROP transaction to submit from this audit." } }\n        default { return [pscustomobject]@{ Class="danger"; Headline="No actionable move"; Copy="Butler does not currently have a governed transaction that is safe to act on."; ActionTitle="No move to make"; ActionCopy="There is no currently governed add/drop action on this screen." } }'
          if text.count(old) != 1:
              raise SystemExit('BF-661 BLOCKED: state presentation anchor drifted')
          text = text.replace(old, new, 1)

          function_start = text.index('function Get-GovernedExplanationView {')
          identity_start_marker = '    $add = ConvertTo-PlayerView (Get-LineValue -Text $Summary -Label "ADD:")\n'
          identity_end_marker = '    if ($lookupState -ceq "EXPLANATION_NOT_CAPTURED") {\n'
          identity_start = text.index(identity_start_marker, function_start)
          identity_end = text.index(identity_end_marker, identity_start)
          new_identity = '''    $decisionState = Get-LineValue -Text $Summary -Label "Decision status:"
          if ([string]::IsNullOrWhiteSpace($decisionState)) {
              throw "BF-661 BLOCKED: current governed decision state is missing"
          }
          $isNoTransaction = $decisionState -ceq "NO_TRANSACTION_TO_ACT_ON"
          $transactionStates = @(
              "CURRENT_AND_ACTIONABLE",
              "CURRENT_REFRESH_RECOMMENDED",
              "TRANSACTION_ALREADY_COMPLETE",
              "TRANSACTION_PENDING_DO_NOT_DUPLICATE",
              "STALE_DO_NOT_ACT"
          )
          $isTransaction = $transactionStates -ccontains $decisionState
          if (-not $isNoTransaction -and -not $isTransaction) {
              throw "BF-661 BLOCKED: unsupported current governed decision state $decisionState"
          }

          $add = ConvertTo-PlayerView (Get-LineValue -Text $Summary -Label "ADD:")
          $drop = ConvertTo-PlayerView (Get-LineValue -Text $Summary -Label "DROP:")
          $hasAddId = -not [string]::IsNullOrWhiteSpace([string]$add.SleeperId)
          $hasDropId = -not [string]::IsNullOrWhiteSpace([string]$drop.SleeperId)
          if ($isNoTransaction) {
              if ($hasAddId -or $hasDropId) {
                  throw "BF-661 BLOCKED: NO_TRANSACTION_TO_ACT_ON must not contain audited ADD/DROP Sleeper ids"
              }
          }
          elseif (-not $hasAddId -or -not $hasDropId) {
              throw "BF-654 BLOCKED: current audited ADD/DROP exact Sleeper ids are missing"
          }

          $lookupIdsRaw = Get-LineValue -Text $lookup -Label "Audited add / drop Sleeper ids:"
          $lookupAddId = "none"
          $lookupDropId = "none"
          if ($isNoTransaction) {
              if ([string]$lookupIdsRaw -cne "none / none") {
                  throw "BF-661 BLOCKED: BF-653 no-transaction audited ADD/DROP ids must be absent"
              }
          }
          else {
              $lookupIds = [regex]::Match([string]$lookupIdsRaw, '^(?<add>[0-9]+)\\s*/\\s*(?<drop>[0-9]+)$')
              if (-not $lookupIds.Success) {
                  throw "BF-654 BLOCKED: unable to parse BF-653 audited ADD/DROP exact Sleeper ids"
              }
              $lookupAddId = $lookupIds.Groups['add'].Value.Trim()
              $lookupDropId = $lookupIds.Groups['drop'].Value.Trim()
              if ($lookupAddId -cne $add.SleeperId -or $lookupDropId -cne $drop.SleeperId) {
                  throw "BF-654 BLOCKED: BF-653 audited ADD/DROP ids disagree with current audited transaction"
              }
          }

          '''.replace('          ', '')
          text = text[:identity_start] + new_identity + text[identity_end:]

          dashboard_function = text.index('function ConvertTo-DashboardHtml {')
          return_marker = '    return @"\n<!doctype html><html lang="en"><head><meta charset="utf-8"'
          dashboard_return = text.index(return_marker, dashboard_function)
          moves_start = text.index('  <div class="moves">\n', dashboard_return)
          moves_end_marker = '  <div class="next"><strong>$(ConvertTo-HtmlText $presentation.ActionTitle)</strong>'
          moves_end = text.index(moves_end_marker, moves_start)
          text = text[:moves_start] + '$movesSection\n' + text[moves_end:]

          dashboard_return = text.index(return_marker, dashboard_function)
          moves_logic = '''    $movesSection = ""
          $transactionStates = @(
              "CURRENT_AND_ACTIONABLE",
              "CURRENT_REFRESH_RECOMMENDED",
              "TRANSACTION_ALREADY_COMPLETE",
              "TRANSACTION_PENDING_DO_NOT_DUPLICATE",
              "STALE_DO_NOT_ACT"
          )
          if ($transactionStates -ccontains $state) {
              $movesSection = @"
          <div class="moves">
            <article class="move add"><h2>ADD</h2><div class="player-name">$(ConvertTo-HtmlText $add.Name)</div><div class="player-meta">$(ConvertTo-HtmlText $add.Position) &middot; $(ConvertTo-HtmlText $add.Team)</div><div class="player-id">Sleeper ID $(ConvertTo-HtmlText $add.SleeperId)</div></article>
            <article class="move drop"><h2>DROP</h2><div class="player-name">$(ConvertTo-HtmlText $drop.Name)</div><div class="player-meta">$(ConvertTo-HtmlText $drop.Position) &middot; $(ConvertTo-HtmlText $drop.Team)</div><div class="player-id">Sleeper ID $(ConvertTo-HtmlText $drop.SleeperId)</div></article>
          </div>
          "@
          }
          elseif ($state -cne "NO_TRANSACTION_TO_ACT_ON" -and $state -cne "NO_AUDITED_DECISION") {
              throw "BF-661 BLOCKED: unsupported dashboard decision state $state"
          }

          '''.replace('          ', '')
          text = text[:dashboard_return] + moves_logic + text[dashboard_return:]

          path.write_text(text, encoding='ascii', newline='\n')

          test = Path('bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf661ScriptTest.java')
          test.write_text(r'''package io.butler.bet.cli;

          import org.junit.jupiter.api.Test;

          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import static org.junit.jupiter.api.Assertions.assertTrue;

          class ButlerDashboardBf661ScriptTest {

              @Test
              void noTransactionUsesExplicitStateAndAbsentAbsentIdentity() throws Exception {
                  String script = script();
                  assertTrue(script.contains("$isNoTransaction = $decisionState -ceq \"NO_TRANSACTION_TO_ACT_ON\""));
                  assertTrue(script.contains("NO_TRANSACTION_TO_ACT_ON must not contain audited ADD/DROP Sleeper ids"));
                  assertTrue(script.contains("$lookupIdsRaw -cne \"none / none\""));
                  assertTrue(script.contains("BF-653 no-transaction audited ADD/DROP ids must be absent"));
                  assertTrue(script.contains("Headline=\"No governed transaction\""));
              }

              @Test
              void transactionBearingPathRetainsExactAddDropChecks() throws Exception {
                  String script = script();
                  assertTrue(script.contains("BF-654 BLOCKED: current audited ADD/DROP exact Sleeper ids are missing"));
                  assertTrue(script.contains("'^(?<add>[0-9]+)\\s*/\\s*(?<drop>[0-9]+)$'"));
                  assertTrue(script.contains("$lookupAddId -cne $add.SleeperId -or $lookupDropId -cne $drop.SleeperId"));
                  assertTrue(script.contains("BF-654 BLOCKED: BF-653 audited ADD/DROP ids disagree with current audited transaction"));
              }

              @Test
              void unknownRecommendationStatesFailClosed() throws Exception {
                  String script = script();
                  assertTrue(script.contains("BF-661 BLOCKED: unsupported current governed decision state"));
                  assertTrue(script.contains("BF-661 BLOCKED: unsupported dashboard decision state"));
              }

              @Test
              void noTransactionRendersExplanationWithoutSyntheticMoveCardsOrCapturePrompt() throws Exception {
                  String script = script();
                  assertTrue(script.contains("$movesSection = \"\""));
                  assertTrue(script.contains("if ($transactionStates -ccontains $state)"));
                  assertTrue(script.contains("elseif ($state -cne \"NO_TRANSACTION_TO_ACT_ON\" -and $state -cne \"NO_AUDITED_DECISION\")"));
                  assertTrue(script.contains("if ($Explanation.Ready)"));
                  assertTrue(script.contains("Active = $false"));
                  assertTrue(script.contains("BF-653 explanation type:"));
                  assertTrue(script.contains("Audited ADD / DROP Sleeper IDs:"));
              }

              private static String script() throws IOException {
                  Path current = Path.of(System.getProperty("user.dir")).toAbsolutePath().normalize();
                  for (int depth = 0; depth < 7 && current != null; depth++) {
                      Path candidate = current.resolve("scripts/butler-dashboard.ps1");
                      if (Files.isRegularFile(candidate)) {
                          return Files.readString(candidate, StandardCharsets.US_ASCII);
                      }
                      current = current.getParent();
                  }
                  throw new IOException("BF-661 test could not locate scripts/butler-dashboard.ps1");
              }
          }
          '''.replace('          ', ''), encoding='ascii', newline='\n')

      - name: Parse Butler dashboard with Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = (Resolve-Path '.\scripts\butler-dashboard.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
              exit 1
          }
          Write-Host 'Windows PowerShell 5.1 parser accepted BF-661 dashboard patch'

      - name: Enforce ASCII-only dashboard source
        shell: powershell
        run: |
          $path = (Resolve-Path '.\scripts\butler-dashboard.ps1').Path
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $bad = @($bytes | Where-Object { $_ -gt 127 })
          if ($bad.Count -gt 0) {
              Write-Error ("BF-661 BLOCKED: dashboard contains {0} non-ASCII byte(s)" -f $bad.Count)
              exit 1
          }
          Write-Host 'BF-661 ASCII-only dashboard source gate passed'

      - name: Run focused BF-661 regression
        shell: powershell
        run: .\gradlew.bat --dependency-verification=strict :bet:bet-cli:test --tests io.butler.bet.cli.ButlerDashboardBf661ScriptTest

      - name: Run full build and tests
        shell: powershell
        run: .\gradlew.bat --dependency-verification=strict clean build

      - name: Verify dependency lockfile is current
        shell: powershell
        run: |
          .\gradlew.bat --dependency-verification=strict :bet:bet-cli:dependencies --write-locks
          if (-not (git diff --quiet -- bet/bet-cli/gradle.lockfile)) {
              git diff -- bet/bet-cli/gradle.lockfile
              throw 'BF-661 BLOCKED: dependency lockfile changed'
          }

      - name: Commit verified permanent BF-661 diff
        shell: powershell
        run: |
          git config user.name "Butler BF-661 verification"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/windows-powershell-parse.yml
          if (Test-Path '.github/workflows/bf-661-apply.yml') { git rm .github/workflows/bf-661-apply.yml }
          git add scripts/butler-dashboard.ps1 bet/bet-cli/src/test/java/io/butler/bet/cli/ButlerDashboardBf661ScriptTest.java .github/workflows/windows-powershell-parse.yml
          git commit -m "BF-661: render governed no-transaction explanation"
          git push origin HEAD:bf-661-dashboard-no-transaction-explanation
