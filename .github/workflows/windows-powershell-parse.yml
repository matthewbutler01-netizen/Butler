name: Windows PowerShell Compatibility

on:
  push:
    branches:
      - main
      - startsit-review-action-summary
      - bf1515-manager-decision-clarity
      - bf1515-lineup-fingerprint
      - bf1515-dashboard-saved-review-proof
      - bf1519-explicit-lineup-change-notice
      - bf1520-matchup-live-roster-proof
      - bf1521-waiver-no-verified-move-clarity
      - bf1522-waiver-history-week-labels
      - bf1523-v04-pin-tested-beta
      - bf1524-history-player-identity-hold
      - bf1525-waiver-evidence-age
      - bf1526-v04-beta-pack-verified-waiver
      - bf1527-one-click-exact-checkout
      - bf1528-week-rollover-readonly-gate
      - bf1529-governed-week-rollover-refresh
    paths:
      - 'scripts/**/*.ps1'
      - 'scripts/**/*.cmd'
      - 'scripts/**/*.cjs'
      - '.github/workflows/windows-powershell-parse.yml'
      - 'gradle/wrapper/gradle-wrapper.properties'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**/*.ps1'
      - 'scripts/**/*.cmd'
      - 'scripts/**/*.cjs'
      - '.github/workflows/windows-powershell-parse.yml'
      - 'gradle/wrapper/gradle-wrapper.properties'

concurrency:
  group: windows-powershell-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast focused evidence-freshness gate. Runs independently of the legacy
  # comprehensive Windows suite (which includes slow SQLite restore tests).
  # Catches v0.4 regressions promptly without weakening that full suite.
  v04-freshness-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check v0.4 on-open freshness and safe diagnostic contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\butler-automatic-waiver-refresh-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-automatic-dashboard-refresh-acceptance.ps1'
          & '.\scripts\butler-automatic-autopilot-refresh-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-automatic-startsit-refresh-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-evidence-refresh-cache-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-dashboard-audit-presentation-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-roster-recovery-order-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1037-startsit-auto-roster-recovery-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1024-v04-autopilot-weekly-watch-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1028-v04-autopilot-prepared-startsit-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-v04-live-page-check-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-m1-real-renderer-proof-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1127-worker-first-open-503-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1129-minimal-500-acceptance.ps1'
          if (-not $?) { exit 1 }
          # BF-1133: each real-worker test runs in a fresh PowerShell process.
          # BF-766 deliberately caches parsed modules globally per runspace;
          # carrying the previous test's deleted temporary module paths into
          # the next fixture would falsely report HTTP 503 instead of 200.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1130-core-down-manager-500-acceptance.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1132-synthetic-manager-success-acceptance.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1136-autopilot-module-isolation-acceptance.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1136-autopilot-module-isolation-acceptance.ps1' -BrokenCss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1136-autopilot-module-isolation-acceptance.ps1' -HostCssThrows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1136-autopilot-module-isolation-acceptance.ps1' -BrokenAccessibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-m2-autopilot-real-render-variants-acceptance.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # BF-1143: actual public HTTP Auto-Pilot must degrade safely if
          # both companion-heavy read slots are occupied (no core/provider).
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1136-autopilot-module-isolation-acceptance.ps1' -BusyGate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\butler-bf1140-autopilot-bounded-companion-acceptance.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\scripts\butler-bf1054-matchup-live-week-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1055-matchup-stale-hold-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1060-auto-week-recovery-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1061-autopilot-week-recovery-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1067-startsit-freshness-banner-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1068-source-timestamps-acceptance.ps1'
          if (-not $?) { exit 1 }
          & '.\scripts\butler-bf1074-autopilot-sourced-startsit-acceptance.ps1'
          if (-not $?) { exit 1 }
          node '.\scripts\butler-auto-refresh-browser-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node '.\scripts\butler-bf1080-real-chromium-onopen-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node '.\scripts\butler-v04-live-page-check-http-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node '.\scripts\butler-v04-package-extract-all-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node '.\scripts\butler-v04-start-draft-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node '.\scripts\butler-v04-safe-update-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node '.\scripts\butler-v04-beta-one-click-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\scripts\butler-bf1527-one-click-checkout-pin-acceptance.ps1'
          if (-not $?) { exit 1 }
          node '.\scripts\butler-bf1076-optional-read-budget-http-e2e.cjs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'BUTLER v0.4 FAST FRESHNESS WINDOWS GATE: PASS'

      # Milestone 1: deliver exactly the same tested, GET-only readiness
      # scripts as a portable zip. The user can unzip and double-click one
      # CMD instead of checking out a branch or typing PowerShell.
      # This does NOT install/start/stop/update a Butler app release.
      - name: Package tested one-click My Team and Waivers checker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'butler-v04-roster-waiver-check'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $allowlist = @(
            'butler-v04-roster-waiver-first-open.cmd',
            'butler-v04-live-page-check.cmd',
            'butler-v04-live-page-check.ps1',
            'butler-decision-refresh.ps1'
          )
          foreach ($name in $allowlist) {
            $src = Join-Path '.\scripts' $name
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) {
              throw 'M1 BLOCKED: a required read-only diagnostic source is missing.'
            }
            Copy-Item -LiteralPath $src -Destination (Join-Path $target $name)
          }
          $readme = @(
            'BUTLER v0.4 - MILESTONE 1: ONE-CLICK READ-ONLY CHECK',
            '',
            'PREREQUISITE: an updated Butler v0.4 development app must already',
            'be running locally. This zip does NOT install, replace, launch',
            'or stop Butler v0.3 or v0.4.',
            '',
            'If NO CURRENT WORKER: this archive cannot start Butler.',
            'From the updated v0.4 source checkout, double-click',
            'scripts\butler-v04-start-18080.cmd and keep its window open.',
            '',
            'IMPORTANT: DO NOT double-click the CMD inside the ZIP viewer!',
            'Windows may extract only one file to Temp; then the CMD fails.',
            'You must Extract All five files to the same regular folder.',
            '',
            '1. Right-click this zip file in File Explorer, choose Extract All.',
            '2. Open the extracted folder; double-click butler-v04-roster-waiver-first-open.cmd.',
            '3. Review the report that opens in Notepad.',
            '4. Share only the report if you want help diagnosing failures.',
            '',
            'The check sends loopback GETs only. Its requests can trigger',
            'Butler existing governed local evidence recovery. No diagnostic',
            'POST, Sleeper add/drop, lineup submission, merge or deployment.',
            'PASS verifies local page contracts, audit and target consistency,',
            'not actual Sleeper freshness, browser script execution or injuries.',
            'An OLDER WORKER or UNRECOGNIZED SERVICE result means the local',
            'running application must be updated separately before acceptance.'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $target 'README.txt'), $readme, [Text.Encoding]::ASCII)
          Write-Host 'MILESTONE 1 PORTABLE DIAGNOSTIC: 4 scripts and README, no app/user data.'

      - name: Upload tested one-click My Team and Waivers checker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-v04-roster-waiver-one-click
          path: ${{ runner.temp }}/butler-v04-roster-waiver-check/
          if-no-files-found: error
          retention-days: 14

      # BF-M1: pinned to reviewed app commit, never an installer,
      # force-stop tool or v0.3 production replacement.
      # BF-BETA: one ZIP to launch the guarded v0.4 read-only beta.
      - name: Package v0.4 one-click beta
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'butler-v04-beta-one-click'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($name in @('butler-v04-beta-one-click.cmd',
                              'butler-v04-beta-one-click.ps1',
                              'butler-v04-safe-update-and-start.ps1')) {
            Copy-Item -LiteralPath (Join-Path '.\scripts' $name) -Destination (Join-Path $target $name) -ErrorAction Stop
          }
          $readme = @(
            'BUTLER v0.4 - READ-ONLY BETA - ONE CLICK',
            '',
            '1. Right-click ZIP and choose Extract All.',
            '2. Double-click butler-v04-beta-one-click.cmd in extracted folder.',
            '3. One launcher updates v0.4, starts it, checks it, opens Dashboard',
            '   and saves the ONE status report in LocalAppData\Butler\diagnostics.',
            '4. Leave the separate Butler app window open while using it.',
            '',
            'If an older v0.4 Butler is already running, the launcher opens',
            'it WITHOUT installing a new build. Close ONLY your known v0.4',
            'window with Ctrl+C and double-click again to install this build.',
            'No v0.3 changes, force-stop, or Sleeper transactions are made.',
            'Normal app GETs may invoke existing governed Butler-local recovery.',
            'WARN/HOLD is not permission to follow stale waiver/lineup advice.',
            'Auto-Pilot is preview-only; advanced automation moves to v0.5.',
            'Live injuries/projections and browser refresh are not certified',
            'merely because the local pages opened.'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $target 'README.txt'),
              $readme, [Text.Encoding]::ASCII)
      - name: Upload v0.4 one-click read-only beta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-v04-beta-one-click
          path: ${{ runner.temp }}/butler-v04-beta-one-click/
          if-no-files-found: error
          retention-days: 14

      - name: Package guarded pinned v0.4 update and start
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'butler-v04-safe-update'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($name in @('butler-v04-safe-update-and-start.cmd',
                              'butler-v04-safe-update-and-start.ps1')) {
            $src = Join-Path '.\scripts' $name
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) {
              throw 'BF-M1 BLOCKED: pinned updater file not found.'
            }
            Copy-Item -LiteralPath $src -Destination (Join-Path $target $name)
          }
          $readme = @(
            'BUTLER v0.4 - PINNED DEVELOPMENT UPDATE AND START',
            '',
            'Only for an existing clean v0.4 checkout at C:\ButlerDev\pr1464.',
            'This updater is pinned to reviewed commit 370cd7bc and port 18080.',
            'It will not upgrade, merge or touch the frozen v0.3 release.',
            '',
            'IMPORTANT: use Windows Explorer EXTRACT ALL, not Open-in-ZIP.',
            'Both the CMD and PS1 must remain together in the extracted folder.',
            '',
            '1. In the window running old v0.4 Butler, press Ctrl+C normally.',
            '2. When the app has stopped, double-click',
            '   butler-v04-safe-update-and-start.cmd in this extracted folder.',
            '3. The helper checks trusted Git origin, clean worktree and free',
            '   loopback port BEFORE fetching and switching to the pinned SHA.',
            '4. Keep the new Butler app console open. Browse 127.0.0.1:18080.',
            '5. Run the previously supplied read-only Milestone 1 checker.',
            '',
            'If PORT OCCUPIED, do NOT kill processes: stop your known app',
            'normally and retry. If LOCAL CHANGES PRESENT, do not discard them.',
            'This helper never runs git reset, git clean, force-kill, database',
            'modification, Sleeper add/drop, a trade or a lineup submission.',
            '',
            'A normal app GET may use its existing governed local evidence',
            'recovery; this launcher does not certify current Sleeper data.',
            'Even if identity passes, a stale waiver decision remains HELD.'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $target 'README.txt'),
              $readme, [Text.Encoding]::ASCII)
      - name: Upload guarded pinned v0.4 updater
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butler-v04-pinned-safe-update
          path: ${{ runner.temp }}/butler-v04-safe-update/
          if-no-files-found: error
          retention-days: 14

  powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse every Butler PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(Get-ChildItem '.\scripts' -Recurse -Filter '*.ps1' -File)
          if ($files.Count -eq 0) {
              Write-Error 'BF-709 BLOCKED: no Butler PowerShell scripts were found.'
              exit 1
          }

          $failed = $false
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $failed = $true
                  foreach ($parseError in $errors) {
                      Write-Error ("{0}:{1}:{2}: {3}" -f $file.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
                  }
              }
          }

          if ($failed) { exit 1 }
          Write-Host ("Windows PowerShell 5.1 parser accepted {0} Butler script(s)." -f $files.Count)

      - name: Enforce ASCII-only Windows script sources
        shell: powershell
        run: |
          $files = @(
              Get-ChildItem '.\scripts' -Recurse -Filter '*.ps1' -File
              Get-ChildItem '.\scripts' -Recurse -Filter '*.cmd' -File
          )
          $failed = $false
          foreach ($file in $files) {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $bad = @($bytes | Where-Object { $_ -gt 127 })
              if ($bad.Count -gt 0) {
                  $failed = $true
                  Write-Error ("BF-709 BLOCKED: {0} contains {1} non-ASCII byte(s)." -f $file.FullName, $bad.Count)
              }
          }
          if ($failed) { exit 1 }
          Write-Host ("ASCII-only Windows source gate passed for {0} file(s)." -f $files.Count)

      - name: Exercise waiver recovery and evidence presentation
        shell: powershell
        run: |
          & '.\scripts\butler-stale-evidence-recovery-acceptance.ps1'
          & '.\scripts\butler-waiver-evidence-display-acceptance.ps1'
          & '.\scripts\butler-automatic-waiver-refresh-acceptance.ps1'
          & '.\scripts\butler-automatic-dashboard-refresh-acceptance.ps1'
          & '.\scripts\butler-automatic-autopilot-refresh-acceptance.ps1'
          & '.\scripts\butler-evidence-refresh-cache-acceptance.ps1'
          & '.\scripts\butler-bf1037-startsit-auto-roster-recovery-acceptance.ps1'
          & '.\scripts\butler-bf972-refresh-outcome-navigation-acceptance.ps1'
          & '.\scripts\butler-bf1515-manager-decision-clarity-acceptance.ps1'
          & '.\scripts\butler-bf1518-dashboard-saved-lineup-proof-acceptance.ps1'
          & '.\scripts\butler-bf1521-waiver-no-verified-move-acceptance.ps1'
          & '.\scripts\butler-bf1525-waiver-evidence-age-acceptance.ps1'
          & '.\scripts\butler-bf1522-waiver-history-week-label-acceptance.ps1'
          & '.\scripts\butler-bf1005-matchup-saved-lineup-review-acceptance.ps1'
          & '.\scripts\butler-bf1020-v04-dashboard-command-center-acceptance.ps1'
          & '.\scripts\butler-bf1021-v04-start-sit-assistant-acceptance.ps1'
          & '.\scripts\butler-bf1024-v04-autopilot-weekly-watch-acceptance.ps1'
          & '.\scripts\butler-v04-live-page-check-acceptance.ps1'
          & '.\scripts\butler-presentation-closeout-acceptance.ps1'

      - name: Exercise accessibility rendering fixtures
        shell: powershell
        run: .\scripts\butler-accessibility-acceptance.ps1

      - name: Exercise verification hardening fixtures
        shell: powershell
        run: .\scripts\butler-verification-hardening-acceptance.ps1

      - name: Exercise read-only fresh-host setup fixtures
        shell: powershell
        run: .\scripts\butler-setup-check-acceptance.ps1

      - name: Exercise first-launch ownership and failure fixtures
        shell: powershell
        run: .\scripts\butler-setup-launch-acceptance.ps1

      - name: Exercise zero-to-Dashboard onboarding fixtures
        shell: powershell
        run: .\scripts\butler-setup-new-league-acceptance.ps1

      - name: Set up Java 25 for guided restore fixtures
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Exercise guided private restore with real SQLite fixtures
        shell: powershell
        run: |
          .\gradlew.bat --dependency-verification=strict :bet:bet-cli:installDist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\butler-setup-restore-acceptance.ps1

      - name: Exercise BF-786 missing runtime database acceptance
        shell: powershell
        run: |
          try {
              & '.\scripts\butler-missing-runtime-db-acceptance.ps1'
          }
          catch {
              Write-Error $_
              exit 1
          }

      - name: Exercise BF-897 portable runtime-data backup/restore acceptance
        shell: powershell
        run: |
          try {
              & '.\scripts\butler-runtime-data-backup-acceptance.ps1'
          }
          catch {
              Write-Error $_
              exit 1
          }

      - name: Exercise BF-707 staging transform under Windows PowerShell 5.1
        shell: powershell
        run: |
          $coreSource = (Resolve-Path '.\scripts\butler-app-shell-core-single.ps1').Path
          $outerSource = (Resolve-Path '.\scripts\butler-app-shell-core.ps1').Path
          $original = 'if ($proxied.ContentType -match ''^text/html'') {'
          $replacement = 'if ($proxied.StatusCode -ge 200 -and $proxied.StatusCode -lt 300 -and $proxied.ContentType -match ''^text/html'') {'

          $coreText = [System.IO.File]::ReadAllText($coreSource)
          $matchCount = [regex]::Matches($coreText, [regex]::Escape($original)).Count
          if ($matchCount -lt 1) {
              Write-Error 'BF-709 BLOCKED: governed dashboard navigation staging source contract is missing.'
              exit 1
          }

          $outerText = [System.IO.File]::ReadAllText($outerSource)
          if ($outerText.Contains('LastIndexOf($coreSingleNavigationOriginal')) {
              Write-Error 'BF-709 BLOCKED: BF-707 single-match staging guard has returned.'
              exit 1
          }
          if (-not $outerText.Contains('$navigationMatchCount = [regex]::Matches($coreSingleText, [regex]::Escape($coreSingleNavigationOriginal)).Count')) {
              Write-Error 'BF-709 BLOCKED: production staging no longer uses the multi-site navigation contract.'
              exit 1
          }

          $stagedText = $coreText.Replace($original, $replacement)
          if ($stagedText.Contains($original)) {
              Write-Error 'BF-709 BLOCKED: staging left an unguarded navigation injection site.'
              exit 1
          }
          $replacementCount = [regex]::Matches($stagedText, [regex]::Escape($replacement)).Count
          if ($replacementCount -ne $matchCount) {
              Write-Error ("BF-709 BLOCKED: staging replacement count mismatch source={0} staged={1}." -f $matchCount, $replacementCount)
              exit 1
          }

          $temp = Join-Path $env:RUNNER_TEMP 'butler-app-shell-core-single.staged.ps1'
          [System.IO.File]::WriteAllText($temp, $stagedText, [System.Text.UTF8Encoding]::new($false))
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($temp, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("staged:{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
              exit 1
          }
          Write-Host ("BF-707 staging transform passed on Windows PowerShell 5.1 across {0} navigation site(s)." -f $matchCount)

      - name: Exercise BF-715 exact waivers staging transform
        shell: powershell
        run: |
          $source = (Resolve-Path '.\scripts\butler-dashboard.ps1').Path
          $temp = Join-Path $env:RUNNER_TEMP 'butler-dashboard.bf715.staged.ps1'
          Copy-Item -LiteralPath $source -Destination $temp -Force

          & '.\scripts\butler-dashboard-bf715-transform.ps1' -DashboardPath $temp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $text = [System.IO.File]::ReadAllText($temp)
          if (-not $text.Contains('function Invoke-ButlerReadOnlyWaiverEvidenceBundle')) {
              Write-Error 'BF-715 BLOCKED: staged dashboard is missing the exact waiver bundle helper.'
              exit 1
          }
          if (-not $text.Contains('$waiverEvidence = Invoke-ButlerReadOnlyWaiverEvidenceBundle')) {
              Write-Error 'BF-715 BLOCKED: exact /waivers route did not switch to the bundle helper.'
              exit 1
          }
          if ($text.Contains('$summary = Invoke-ButlerReadOnlySummary' + [Environment]::NewLine + '                    $waiverBundle = Invoke-ButlerReadOnlyWaiverBoard' + [Environment]::NewLine + '                    $rosterContext = Invoke-ButlerReadOnlyRosterContext')) {
              Write-Error 'BF-715 BLOCKED: staged /waivers route still contains three sequential governed reads.'
              exit 1
          }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($temp, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("bf715-staged:{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
              exit 1
          }
          Write-Host 'BF-715 exact /waivers bundle transform passed on Windows PowerShell 5.1.'

      - name: Exercise BF-710 cmd proxy argument tokenization
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bf710-proxy'
          $scripts = Join-Path $root 'scripts'
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null
          Copy-Item '.\scripts\butler-direct-java-gradle-proxy.cmd' (Join-Path $root 'gradlew.bat') -Force

          $stub = @'
          param(
              [string]$Task,
              [string]$ArgumentText,
              [string]$ArgumentRemainder
          )
          $capture = "{0}|{1}|{2}" -f $Task, $ArgumentText, $ArgumentRemainder
          [System.IO.File]::WriteAllText($env:BF710_CAPTURE, $capture, [System.Text.Encoding]::ASCII)
          exit 0
          '@
          [System.IO.File]::WriteAllText((Join-Path $scripts 'butler-direct-java-dispatch.ps1'), $stub, [System.Text.Encoding]::ASCII)
          $proxy = Join-Path $root 'gradlew.bat'
          $env:BF710_CAPTURE = Join-Path $root 'capture.txt'

          & $proxy ':bet:bet-cli:sleeperLiveWaiverLatestGovernedDecisionSummary' '--args=league-123'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $single = [System.IO.File]::ReadAllText($env:BF710_CAPTURE, [System.Text.Encoding]::ASCII).Split('|', 3)
          if ($single.Count -ne 3 -or $single[0] -cne ':bet:bet-cli:sleeperLiveWaiverLatestGovernedDecisionSummary') {
              Write-Error 'BF-710 BLOCKED: cmd proxy lost the whitelisted task name.'
              exit 1
          }
          $singleValue = if ($single[1] -ceq '--args') { $single[2].Trim() } elseif ($single[1].StartsWith('--args=', [System.StringComparison]::Ordinal)) { $single[1].Substring(7).Trim() } else { '' }
          if ($singleValue -cne 'league-123') {
              Write-Error ("BF-710 BLOCKED: single-value --args tokenization lost the league id. capture={0}" -f ($single -join '|'))
              exit 1
          }

          & $proxy ':bet:bet-cli:sleeperLiveWaiverGovernedExplanationLookup' '--args=league-123 audit-456'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $multi = [System.IO.File]::ReadAllText($env:BF710_CAPTURE, [System.Text.Encoding]::ASCII).Split('|', 3)
          $multiValue = if ($multi[1] -ceq '--args') { $multi[2].Trim() } elseif ($multi[1].StartsWith('--args=', [System.StringComparison]::Ordinal)) { (($multi[1].Substring(7) + ' ' + $multi[2]).Trim()) } else { '' }
          if ($multiValue -cne 'league-123 audit-456') {
              Write-Error ("BF-710 BLOCKED: multi-value --args tokenization changed governed arguments. capture={0}" -f ($multi -join '|'))
              exit 1
          }
          Write-Host 'BF-710 cmd proxy preserved single-value and multi-value Gradle-compatible arguments.'
