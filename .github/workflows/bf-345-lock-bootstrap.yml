name: BF-345 Dependency Lock Bootstrap

on:
  push:
    branches:
      - bf-345-add-gradle-dependency-locking
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate dependency lock state
        run: ./gradlew :bet:bet-cli:dependencies --write-locks

      - name: Commit generated lockfile
        run: |
          test -f bet/bet-cli/gradle.lockfile
          git add bet/bet-cli/gradle.lockfile
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "BF-345: Add generated dependency lockfile"
          git push
