name: BF-660 Temporary Runner

on:
  push:
    branches:
      - bf-660-capture-explanation-with-audit

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf-660-capture-explanation-with-audit
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply BF-660
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 40267f2118dc23c8bcec150d57326711ef32a1c1
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/bf660-impl.yml').read_text()
          start = source.index('          from pathlib import Path\n')
          end = source.index('          PY\n\n          ./gradlew', start)
          embedded = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines()) + '\n'
          Path('/tmp/bf660_patch.py').write_text(script)
          PY
          python /tmp/bf660_patch.py
          ./gradlew :bet:bet-cli:test --tests io.butler.bet.sleeper.SleeperLiveWaiverRecommendationAuditCaptureTest --tests io.butler.bet.sleeper.SleeperLiveWaiverGovernedExplanationCaptureTest --tests io.butler.bet.sleeper.SleeperLiveWaiverFinalRecommendationBundleTest
          git add -A bet/bet-cli/src/main/java/io/butler/bet/sleeper \
                     bet/bet-cli/src/main/java/io/butler/bet/cli/ButlerSleeperLiveWaiverRecommendationAuditCaptureCli.java \
                     bet/bet-cli/src/test/java/io/butler/bet/sleeper/SleeperLiveWaiverRecommendationAuditCaptureTest.java
          git commit -m "BF-660 capture explanation with governed audit"
          git push origin HEAD:bf-660-capture-explanation-with-audit
