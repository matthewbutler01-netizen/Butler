name: BF-656 No-Script Fix

on:
  push:
    branches:
      - bf-656-dashboard-copy-refresh-commands
    paths:
      - .github/workflows/bf656-noscript-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bf-656-dashboard-copy-refresh-commands
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply BF-656 no-script fix
        run: python .github/bf656_noscript_fix.py
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile BF-656 regression test
        run: ./gradlew :bet:bet-cli:testClasses --no-daemon
      - name: Run BF-656 and base security regression tests
        run: ./gradlew :bet:bet-cli:test --tests io.butler.bet.cli.ButlerDashboardBf656ScriptTest --tests io.butler.bet.cli.ButlerDashboardScriptTest --no-daemon
      - name: Commit corrected BF-656 dashboard wiring
        run: |
          git config user.name "Matt"
          git config user.email "323053860+matthewbutler01-netizen@users.noreply.github.com"
          git add scripts/butler-dashboard.ps1
          git diff --cached --quiet && exit 0
          git commit -m "BF-656: preserve no-script copy-safe dashboard"
          git push origin HEAD:bf-656-dashboard-copy-refresh-commands
